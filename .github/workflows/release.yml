name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build binaries
        run: |
          set -eux
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          LDFLAGS="-s -w -X main.version=${VERSION}"

          # Agent: controlled machines (Windows first, plus Linux). The Windows
          # agent is a GUI-subsystem binary so no console window opens at logon.
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS -H windowsgui" -o dist/astrea-agent.exe ./cmd/astrea-agent
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/astrea-agent-linux-amd64 ./cmd/astrea-agent
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/astrea-agent-linux-arm64 ./cmd/astrea-agent

          # Hub: the operator's machine running Hermes.
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/astrea-hub-linux-amd64 ./cmd/astrea-hub
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/astrea-hub-linux-arm64 ./cmd/astrea-hub
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/astrea-hub.exe ./cmd/astrea-hub

          # Panel: hardware/usage dashboard on the operator's machine.
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/astrea-panel-linux-amd64 ./cmd/astrea-panel
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/astrea-panel-linux-arm64 ./cmd/astrea-panel

          cp scripts/install.ps1 dist/install.ps1
          cp scripts/install.cmd dist/install.cmd
          cp scripts/install.sh  dist/install.sh
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Upload binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  msi:
    needs: release-build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download binaries artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Build MSI with WiX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "${env:GITHUB_REF_NAME}" -replace '^v',''
          dotnet tool install --global wix --version 4.0.5
          wix extension add -g WixToolset.Util.wixext/4.0.5
          wix build packaging/wix/astrea.wxs `
            -arch x64 `
            -ext WixToolset.Util.wixext `
            -d Version="$version" `
            -d AgentExe="dist/astrea-agent.exe" `
            -d InstallPs1="scripts/install.ps1" `
            -o "dist/astrea-agent-$version-x64.msi"
          Copy-Item "dist/astrea-agent-$version-x64.msi" "dist/astrea-agent.msi"
      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: msi
          path: dist/*.msi

  publish:
    needs: [release-build, msi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: msi
          path: dist
      - name: Refresh checksums (include MSI)
        run: (cd dist && rm -f SHA256SUMS.txt && sha256sum * > SHA256SUMS.txt)
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
