name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Vet (windows)
        run: GOOS=windows go vet ./...
      - name: Cross-compile agent (windows)
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags "-H windowsgui" ./cmd/astrea-agent
      - name: Build (linux)
        run: go build ./...
