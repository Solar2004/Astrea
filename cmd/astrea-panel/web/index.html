<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Astrea</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Astrea">
<meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0E12" media="(prefers-color-scheme: dark)">
<style>
  /* Tokens — see docs/DESIGN.md. Status colors always ship with a text label. */
  :root {
    color-scheme: light;
    --bg: #F5F5F7;
    --sidebar: rgba(240, 240, 244, .78);
    --surface: #FFFFFF;
    --surface-2: #F1F1F4;
    --surface-3: #E7E7EC;
    --border: rgba(0, 0, 0, .08);
    --divider: rgba(0, 0, 0, .06);
    --track: #ECECF0;
    --text: #1D1D1F;
    --text-2: #515154;
    --text-3: #86868B;
    --primary: #5B4BDB;
    --primary-hover: #4C3CCB;
    --primary-soft: rgba(91, 75, 219, .10);
    --primary-area: rgba(91, 75, 219, .12);
    --on-primary: #FFFFFF;
    --good: #12A150;
    --warn: #B7791F;
    --bad: #E5484D;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .04), 0 1px 1px rgba(0, 0, 0, .02);
    --shadow-md: 0 2px 6px rgba(0, 0, 0, .04), 0 10px 28px rgba(0, 0, 0, .07);
    --shadow-lg: 0 24px 64px rgba(0, 0, 0, .22);
    --radius: 16px;
    --radius-sm: 10px;
    --sidebar-w: 256px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #0E0E12;
      --sidebar: rgba(22, 22, 28, .72);
      --surface: #18181D;
      --surface-2: #222229;
      --surface-3: #2C2C34;
      --border: rgba(255, 255, 255, .08);
      --divider: rgba(255, 255, 255, .06);
      --track: #2A2A32;
      --text: #F5F5F7;
      --text-2: #B4B4BC;
      --text-3: #7C7C86;
      --primary: #8B7CFF;
      --primary-hover: #9D90FF;
      --primary-soft: rgba(139, 124, 255, .16);
      --primary-area: rgba(139, 124, 255, .20);
      --on-primary: #0E0E12;
      --good: #45D483;
      --warn: #F5A524;
      --bad: #FF6369;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
      --shadow-md: 0 2px 6px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .35);
      --shadow-lg: 0 24px 64px rgba(0, 0, 0, .6);
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--primary); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 6px; }
  .num, .tnum { font-variant-numeric: tabular-nums; }
  .icon { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .muted { color: var(--text-3); }
  .spacer { flex: 1; }

  /* ---------- layout ---------- */
  .app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: 100vh; }
  .sidebar {
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
    display: flex; flex-direction: column; gap: 4px;
    padding: 18px 12px 14px;
    background: var(--sidebar); border-right: 1px solid var(--border);
    -webkit-backdrop-filter: saturate(180%) blur(24px); backdrop-filter: saturate(180%) blur(24px);
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; font-weight: 700; font-size: 17px; letter-spacing: -.01em; color: var(--text); }
  .brand img { width: 28px; height: 28px; border-radius: 7px; }
  .brand:hover { text-decoration: none; }
  .nav-label { font-size: 11px; font-weight: 600; color: var(--text-3); letter-spacing: .02em; padding: 14px 10px 6px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; min-height: 36px;
    padding: 6px 10px; border-radius: var(--radius-sm); color: var(--text); font-weight: 500;
  }
  .nav-item:hover { background: var(--surface-3); text-decoration: none; }
  .nav-item[aria-current="page"] { background: var(--primary-soft); color: var(--primary); }
  .nav-item .icon { color: var(--text-2); }
  .nav-item[aria-current="page"] .icon { color: var(--primary); }
  .nav-item .two { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
  .nav-item .two b { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav-item .two small { font-size: 11.5px; color: var(--text-3); }
  .nav-item .end { margin-left: auto; font-size: 12px; color: var(--text-3); }
  .sidebar .foot { margin-top: auto; padding: 12px 10px 0; border-top: 1px solid var(--divider); font-size: 12px; color: var(--text-3); display: grid; gap: 4px; }
  .sidebar .foot .row { display: flex; align-items: center; gap: 6px; }

  .main { min-width: 0; }
  .topbar, .scrim { display: none; }
  .view { max-width: 1240px; margin: 0 auto; padding: 32px 40px 64px; }

  /* ---------- status dot + chips (HeroUI "flat" chip) ---------- */
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--text-3); }
  .t-good { --tone: var(--good); } .t-warn { --tone: var(--warn); } .t-bad { --tone: var(--bad); }
  .t-primary { --tone: var(--primary); } .t-neutral { --tone: var(--text-3); }
  .dot[class*="t-"] { background: var(--tone); }
  .dot.pulse { box-shadow: 0 0 0 0 var(--tone); animation: pulse 2.4s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--tone) 55%, transparent); } 70%, 100% { box-shadow: 0 0 0 6px transparent; } }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px;
    border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap;
    color: color-mix(in srgb, var(--tone, var(--text-3)) 88%, var(--text));
    background: color-mix(in srgb, var(--tone, var(--text-3)) 14%, transparent);
  }
  .chip .dot { width: 6px; height: 6px; background: var(--tone, var(--text-3)); }
  .chip .icon { width: 13px; height: 13px; stroke-width: 2.2; margin-left: -2px; }

  /* ---------- buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    height: 36px; padding: 0 14px; border-radius: var(--radius-sm); border: 0; cursor: pointer;
    background: var(--surface-2); color: var(--text); font-weight: 600; font-size: 13.5px;
    transition: background .15s, transform .1s;
  }
  .btn:hover { background: var(--surface-3); text-decoration: none; }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .5; cursor: default; transform: none; }
  .btn.primary { background: var(--primary); color: var(--on-primary); }
  .btn.primary:hover { background: var(--primary-hover); }
  .btn.danger { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
  .btn.ghost { background: transparent; }
  .btn.ghost:hover { background: var(--surface-2); }
  .btn.sm { height: 30px; padding: 0 11px; font-size: 12.5px; }
  .btn.icon-only { width: 36px; padding: 0; }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- page header ---------- */
  .crumbs { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-3); margin-bottom: 6px; }
  .crumbs a { color: var(--text-3); }
  .page-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 16px; margin-bottom: 24px; }
  .page-head h1 { margin: 0; font-size: 30px; line-height: 1.15; font-weight: 700; letter-spacing: -.022em; }
  .page-head .sub { color: var(--text-2); margin-top: 4px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .page-head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  h2.section { font-size: 17px; font-weight: 650; letter-spacing: -.01em; margin: 32px 0 12px; display: flex; align-items: center; gap: 8px; }
  h2.section .count { font-size: 13px; color: var(--text-3); font-weight: 500; }

  /* ---------- cards ---------- */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow-sm); min-width: 0; }
  .card h3 { margin: 0; font-size: 13px; font-weight: 600; color: var(--text-2); display: flex; align-items: center; gap: 8px; }
  .card .model { color: var(--text-3); font-size: 12.5px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .wide { grid-column: 1 / -1; }

  /* KPI tiles */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
  .kpi .label { font-size: 13px; color: var(--text-2); font-weight: 500; display: flex; align-items: center; gap: 7px; }
  .kpi .value { font-size: 34px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; margin-top: 8px; font-variant-numeric: tabular-nums; }
  .kpi .value small { font-size: 18px; color: var(--text-3); font-weight: 600; }
  .kpi .hint { font-size: 12px; color: var(--text-3); margin-top: 2px; }

  /* machine cards on the overview */
  a.mcard { display: flex; flex-direction: column; gap: 14px; color: inherit; transition: transform .15s, box-shadow .15s, border-color .15s; }
  a.mcard:hover { text-decoration: none; transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: color-mix(in srgb, var(--primary) 35%, var(--border)); }
  a.mcard.off { background: color-mix(in srgb, var(--surface) 60%, var(--bg)); }
  .mcard .top { display: flex; align-items: center; gap: 12px; }
  .os-tile { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; flex: none; background: var(--primary-soft); color: var(--primary); }
  .os-tile .icon { width: 22px; height: 22px; }
  .mcard.off .os-tile { background: var(--surface-2); color: var(--text-3); }
  .mcard .who { min-width: 0; }
  .mcard .who b { display: block; font-size: 16px; font-weight: 650; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mcard .who small { color: var(--text-3); font-size: 12.5px; }
  .mcard .chev { margin-left: auto; color: var(--text-3); }
  .bars { display: grid; grid-template-columns: 38px 1fr 40px; gap: 7px 10px; align-items: center; font-size: 12.5px; }
  .bars .k { color: var(--text-3); font-weight: 500; }
  .bars .v { text-align: right; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .mcard .bottom { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-top: 12px; border-top: 1px solid var(--divider); font-size: 12.5px; color: var(--text-2); }
  .mcard .off-msg { color: var(--text-3); font-size: 13px; }
  .mcard .bottom { margin-top: auto; }
  .glossary .li .chip { min-width: 112px; justify-content: flex-start; }
  .glossary .li .v { margin-left: 4px !important; }

  /* meters (4px rounded data-ends, anchored to the baseline) */
  .meter { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; }
  .meter.thin { height: 6px; }
  .meter > span { display: block; height: 100%; border-radius: 4px; background: var(--primary); transition: width .5s cubic-bezier(.2, .8, .2, 1); }
  .meter.hot > span { background: var(--bad); }

  /* metric cards (machine view) */
  .hero { display: flex; align-items: baseline; gap: 10px; margin: 14px 0 10px; }
  .hero .big { font-size: 34px; font-weight: 700; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
  .hero .detail { color: var(--text-2); font-size: 13px; font-variant-numeric: tabular-nums; }
  .spark { position: relative; margin-top: 14px; }
  .spark svg { display: block; width: 100%; height: 64px; overflow: visible; }
  .spark .tip { position: absolute; top: -6px; transform: translate(-50%, -100%); pointer-events: none;
                background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
                padding: 4px 8px; font-size: 12px; white-space: nowrap; box-shadow: var(--shadow-md);
                display: none; font-variant-numeric: tabular-nums; }
  .spark .axis { display: flex; justify-content: space-between; color: var(--text-3); font-size: 11px; margin-top: 4px; }
  .cores-label { color: var(--text-3); font-size: 11.5px; margin: 14px 0 6px; }
  .cores { display: flex; gap: 2px; height: 36px; }
  .cores span { flex: 1; min-width: 0; display: flex; align-items: flex-end; background: var(--track); border-radius: 3px; overflow: hidden; }
  .cores span i { display: block; width: 100%; background: var(--primary); min-height: 1px; border-radius: 3px 3px 0 0; }
  .disk + .disk { margin-top: 14px; }
  .disk .row { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; margin-bottom: 6px; }
  .disk .row .v { color: var(--text-2); font-variant-numeric: tabular-nums; }

  /* segmented control (Apple) */
  .segmented { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; margin-bottom: 18px; }
  .segmented button { border: 0; background: transparent; padding: 6px 16px; border-radius: 8px; font-weight: 600; font-size: 13px; color: var(--text-2); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  .segmented button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm), 0 0 0 1px var(--border); }
  .segmented .n { font-size: 11px; color: var(--text-3); font-weight: 600; }

  /* inset grouped list (iOS Settings) */
  .list { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); overflow: hidden; }
  .list .li { display: flex; align-items: center; gap: 12px; padding: 13px 16px; min-height: 52px; position: relative; }
  .list .li + .li::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: 1px solid var(--divider); }
  .list .li .k { color: var(--text); font-weight: 500; }
  .list .li .k small { display: block; color: var(--text-3); font-weight: 400; font-size: 12px; margin-top: 1px; }
  .list .li .v { margin-left: auto; color: var(--text-2); text-align: right; font-variant-numeric: tabular-nums; }
  .list-title { font-size: 12px; font-weight: 600; color: var(--text-3); letter-spacing: .02em; margin: 24px 4px 8px; text-transform: uppercase; }
  [role="tabpanel"] > .list-title:first-child { margin-top: 4px; }
  .list-foot { font-size: 12px; color: var(--text-3); margin: 8px 4px 0; }

  /* callouts / banners */
  .callout { display: flex; gap: 14px; align-items: flex-start; padding: 16px 18px; border-radius: var(--radius);
             background: color-mix(in srgb, var(--tone, var(--primary)) 9%, var(--surface)); border: 1px solid color-mix(in srgb, var(--tone, var(--primary)) 25%, var(--border)); margin-bottom: 18px; }
  .callout > .icon { color: var(--tone, var(--primary)); width: 22px; height: 22px; margin-top: 1px; }
  .callout b { display: block; margin-bottom: 2px; }
  .callout p { margin: 0; color: var(--text-2); }
  .callout ul { margin: 8px 0 0; padding-left: 18px; color: var(--text-2); }
  .callout .actions { margin-left: auto; display: flex; gap: 8px; align-self: center; flex-wrap: wrap; }

  /* empty states */
  .empty { text-align: center; padding: 56px 24px; color: var(--text-2); }
  .empty img { width: 72px; height: 72px; border-radius: 18px; box-shadow: var(--shadow-md); }
  .empty h2 { color: var(--text); font-size: 22px; letter-spacing: -.015em; margin: 18px 0 6px; }
  .empty p { margin: 0 auto 18px; max-width: 440px; }
  .empty-sm { color: var(--text-3); font-size: 13px; padding: 8px 0; }

  /* services */
  .svc .li .nm { font-weight: 600; }
  .svc .li .meta { color: var(--text-3); font-size: 12px; }

  /* help */
  .steps { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .step .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); font-weight: 700; font-size: 13px; margin-bottom: 12px; }
  .step h3 { font-size: 15px; color: var(--text); margin-bottom: 6px; }
  .step p { margin: 0; color: var(--text-2); font-size: 13.5px; }
  code, pre { font-family: "SF Mono", "Geist Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
  pre { background: var(--surface-2); padding: 12px 14px; border-radius: var(--radius-sm); overflow-x: auto; margin: 10px 0 0; white-space: pre; }
  :not(pre) > code { background: var(--surface-2); padding: 1px 6px; border-radius: 6px; }

  /* screen viewer (sheet) */
  .sheet-bg { position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center;
              background: rgba(0, 0, 0, .45); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); padding: 24px; }
  .sheet-bg.open { display: flex; animation: fade .18s ease-out; }
  .sheet { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow-lg); border: 1px solid var(--border);
           max-width: min(1320px, 96vw); max-height: 94vh; display: flex; flex-direction: column; overflow: hidden; animation: rise .22s cubic-bezier(.2, .8, .2, 1); }
  .sheet .bar { display: flex; align-items: center; gap: 10px; padding: 12px 14px 12px 20px; border-bottom: 1px solid var(--divider); }
  .sheet .bar h3 { margin: 0; font-size: 15px; font-weight: 650; }
  .sheet .bar small { color: var(--text-3); font-size: 12px; }
  .sheet .body { padding: 14px; display: flex; align-items: center; justify-content: center; min-width: min(640px, 90vw); min-height: 300px; background: var(--bg); overflow: auto; }
  /* Fit: the whole screen always visible, never cropped. Real size: scroll around it. */
  .sheet img { display: block; width: auto; height: auto; max-width: calc(96vw - 28px); max-height: calc(94vh - 92px); object-fit: contain; border-radius: 10px; box-shadow: var(--shadow-md); cursor: zoom-in; }
  .sheet .body.real { display: block; max-width: 96vw; max-height: calc(94vh - 64px); }
  .sheet .body.real img { max-width: none; max-height: none; cursor: zoom-out; }
  .sheet .msg { color: var(--text-2); padding: 40px; text-align: center; }
  .sheet .msg .btn { margin-top: 14px; }
  .sheet .body:focus { outline: none; }
  .live-dot { display: inline-flex; align-items: center; gap: 6px; }
  /* Taking control: an amber ring around the whole window, so it's never ambiguous who drives the mouse */
  .sheet.ctl { box-shadow: 0 0 0 3px var(--warn), var(--shadow-lg); }
  .sheet.ctl img { cursor: default; touch-action: none; max-height: calc(94vh - 140px); }
  .ctl-bar { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; padding: 8px 14px 8px 20px; font-size: 13px;
             background: color-mix(in srgb, var(--warn) 14%, var(--surface)); border-bottom: 1px solid var(--divider); }
  .ctl-bar[hidden] { display: none; }
  .ctl-bar b { color: color-mix(in srgb, var(--warn) 65%, var(--text)); }
  .ctl-bar .keys { margin-left: auto; display: flex; gap: 4px; flex-wrap: wrap; }
  .ctl-bar .keys .btn { height: 26px; padding: 0 9px; font-size: 12px; background: var(--surface); }
  .toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); cursor: pointer; user-select: none; }
  .toggle input { appearance: none; width: 36px; height: 22px; border-radius: 999px; background: var(--surface-3); position: relative; cursor: pointer; transition: background .2s; margin: 0; }
  .toggle input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
  .toggle input:checked { background: var(--good); }
  .toggle input:checked::after { transform: translateX(14px); }

  /* toasts */
  .toasts { position: fixed; right: 20px; bottom: 20px; display: grid; gap: 8px; z-index: 40; }
  .toast { display: flex; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
           padding: 12px 16px; box-shadow: var(--shadow-md); max-width: 380px; animation: rise .22s cubic-bezier(.2, .8, .2, 1); }
  .toast .icon { color: var(--tone); }

  /* activity timeline */
  .timeline .li { align-items: flex-start; }
  .timeline .when { width: 64px; flex: none; color: var(--text-3); font-size: 12px; padding-top: 2px; font-variant-numeric: tabular-nums; }
  .timeline .what { min-width: 0; flex: 1; }
  .timeline .what b { font-weight: 600; }
  .timeline .what code { display: block; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-2); background: none; padding: 0; }
  .timeline .what .err { color: var(--bad); font-size: 12.5px; margin-top: 3px; }
  .toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }

  /* forms */
  .field { display: grid; gap: 6px; margin-top: 12px; }
  .field label { font-size: 12.5px; font-weight: 600; color: var(--text-2); }

<script>
"use strict";
const POLL_MS = 2000;
const HISTORY = 60; // samples kept per series (~2 min)
const history = new Map(); // key -> [{t, v}]
const lastGood = new Map(); // key -> last stats seen online
const lastSeen = new Map(); // key -> ms timestamp of last online poll

const S = {
  list: null,       // last /api/stats payload (null = not loaded yet)
  ok: true,         // panel backend reachable
  err: "",
  updatedAt: 0,
  version: null,    // /api/version payload, null if the endpoint doesn't exist
  pending: null,    // id of an action waiting for its inline confirmation
  busy: new Set(),  // ids of actions in flight
  audit: {},        // machine key -> {t, items, err, status, loading}
  showAuto: false,  // activity: also show the panel's own automatic queries
  add: { text: "", name: "" }, // "add machine" form
  cache: {},        // url -> {t, data, err, status, loading} (see load())
  taskFilter: "all", // tasks view: all | running | problems
  taskMachine: "",  // tasks view: "" = whole fleet
  taskOnlyErrors: false, // task detail: show only the failed actions
  ev: { list: [], last: 0, loaded: false, err: null, status: 0 }, // /api/events, oldest first
  evSeen: +localStorage.getItem("astrea.evSeen") || 0, // highest seq the user has looked at
  evOpenSeen: null, // evSeen when the notices view was opened: newer rows are highlighted
  evMachine: "",    // notices view: "" = whole fleet
  mem: {},          // machine key -> {draft, refreshing, q, programs, summary} (memory tab UI state)
};

/* ---------- tiny DOM helpers ---------- */
const $ = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) el.append(k); // views nest arrays (groups of rows)
  return el;
};
const SVG = "http://www.w3.org/2000/svg";
function icon(name, cls = "") {
  const s = document.createElementNS(SVG, "svg");
  s.setAttribute("class", "icon " + cls);
  s.setAttribute("aria-hidden", "true");
  const u = document.createElementNS(SVG, "use");
  u.setAttribute("href", "#i-" + name);
  s.append(u);
  return s;
}
// modeChip: the AI's permission level, always visible (the user asked to see "yolo" at a glance).
function modeChip(admin, long = false) {
  const mode = admin?.mode;
  if (!mode) return null;
  const ro = mode === "readonly";
  const ic = icon(ro ? "eye" : "bolt");
  return $("span", { class: "chip t-" + (ro ? "neutral" : "primary"),
                     title: ro ? "Solo lectura: la IA puede mirar, pero no cambiar nada" : "Modo YOLO: la IA tiene control total del equipo" },
    ic, ro ? "Solo lectura" : long ? "YOLO · control total" : "YOLO");
}
const chip = (tone, label, withDot = true) => $("span", { class: "chip t-" + tone }, withDot ? $("span", { class: "dot" }) : null, label);

/* ---------- formatting ---------- */
function bytes(n) {
  if (n == null) return "—";
  const u = ["B", "KB", "MB", "GB", "TB"];
  let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (n >= 100 || i === 0 ? n.toFixed(0) : n.toFixed(1)) + " " + u[i];
}
const pct = v => v == null ? "—" : Math.round(v) + "%";
const clamp = v => Math.max(0, Math.min(100, v ?? 0));
function uptime(s) {
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? `${d} d ${h} h` : h ? `${h} h ${m} min` : `${m} min`;
}
function ago(sec) {
  if (sec == null) return "—";
  if (sec < 60) return "hace " + Math.max(1, Math.round(sec)) + " s";
  if (sec < 3600) return "hace " + Math.round(sec / 60) + " min";
  if (sec < 86400) return "hace " + Math.round(sec / 3600) + " h";
  return "hace " + Math.round(sec / 86400) + " d";
}
const hhmmss = t => new Date(t).toLocaleTimeString();
const keyOf = (m, idx) => m.name || "m" + idx;
const titleOf = (m, idx, s) => m.name || s?.host?.hostname || "Equipo " + (idx + 1);
const osName = s => [s?.host?.platform, s?.host?.platform_version].filter(Boolean).join(" ");

/* ---------- history (sparklines) ---------- */
const series = key => history.get(key) || [];
function record(key, v, t) {
  if (v == null) return;
  const h = history.get(key) || [];
  h.push({ t, v: clamp(v) });
  if (h.length > HISTORY) h.shift();
  history.set(key, h);
}
function recordAll(list, t) {
  list.forEach((m, idx) => {
    const key = keyOf(m, idx);
    if (m.online) lastSeen.set(key, t);
    if (!m.online || !m.stats) return;
    lastGood.set(key, m.stats);
    const s = m.stats;

function presence(m, key) {

function sparkline(points, label) {
  const W = 300, H = 64;
  const wrap = $("div", { class: "spark" });
  const svg = document.createElementNS(SVG, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("preserveAspectRatio", "none");
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", `${label}: historial de uso de los últimos 2 minutos`);
  const x = i => (HISTORY <= 1 ? 0 : (i + HISTORY - points.length) * W / (HISTORY - 1));
  const y = v => H - 1 - v / 100 * (H - 2);
  const mk = (tag, attrs) => { const e = document.createElementNS(SVG, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); svg.append(e); return e; };
  mk("line", { x1: 0, x2: W, y1: H - 0.5, y2: H - 0.5, stroke: "var(--divider)", "stroke-width": 1, "vector-effect": "non-scaling-stroke" });
  if (points.length > 1) {
    const line = points.map((p, i) => `${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
    mk("polygon", { points: `${x(0)},${H} ${line} ${x(points.length - 1)},${H}`, fill: "var(--primary-area)" });
    mk("polyline", { points: line, fill: "none", stroke: "var(--primary)", "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round", "vector-effect": "non-scaling-stroke" });
  }
  const cross = mk("line", { y1: 0, y2: H, stroke: "var(--text-3)", "stroke-width": 1, "vector-effect": "non-scaling-stroke", visibility: "hidden" });
  const tip = $("div", { class: "tip" });
  svg.addEventListener("mousemove", ev => {
    if (!points.length) return;
    const r = svg.getBoundingClientRect();
    const fx = (ev.clientX - r.left) / r.width * W;
    let best = 0;
    points.forEach((p, i) => { if (Math.abs(x(i) - fx) < Math.abs(x(best) - fx)) best = i; });
    const p = points[best], px = x(best);
    cross.setAttribute("x1", px); cross.setAttribute("x2", px); cross.setAttribute("visibility", "visible");
    tip.textContent = `${pct(p.v)} · ${hhmmss(p.t)}`;
    tip.style.left = (px / W * 100) + "%";
    tip.style.display = "block";
  });
  svg.addEventListener("mouseleave", () => { cross.setAttribute("visibility", "hidden"); tip.style.display = "none"; });
  wrap.append(svg, tip, $("div", { class: "axis" }, $("span", {}, "hace 2 min"), $("span", {}, "ahora")));
  return wrap;
}

// viewTask: one task as an audit trail — what the AI said (notes) interleaved with what it did (actions).

  const cancelHint = S.pending === "cancel:" + machine + "/" + id ? $("div", { class: "callout sm t-warn", style: "margin:-8px 0 18px" }, icon("info"),

  // Timeline: start, notes and actions by time, end. Oldest first: it reads like a story.

  const rows = ev.filter(e => !S.taskOnlyErrors || (e.k === "act" && !e.a.ok)).map(e => {
    if (e.k === "edge") return $("div", { class: "li edge" }, $("span", { class: "when" }, when(e.ts)),

    if (e.k === "note") return $("div", { class: "li note" }, $("span", { class: "when" }, when(e.ts)),

      $("div", { class: "what" }, $("b", {}, "La IA anotó" + (e.n.progress ? " · " + e.n.progress : "")), e.n.text ? $("p", {}, e.n.text) : null));
    const a = e.a;
    return $("div", { class: "li" + (a.ok ? "" : " fail") }, $("span", { class: "when" }, when(a.ts)),
      $("span", { class: "mark" }, icon(a.ok ? "dot" : "alert")),
      $("div", { class: "what" }, $("b", {}, verb(a.method)),
        a.summary ? $("code", { title: a.summary }, a.summary) : null,
        a.error ? $("div", { class: "err" }, a.error) : null),
      a.ok ? null : chip("bad", "Falló"));
  });

  return [crumbs, head, cancelHint, c.data.stale ? staleNote(t) : null,

    outcome,
    $("div", { class: "kpis" },
      kpiTile("Progreso", t.progress || "—", null, f != null ? Math.round(f) + "% completado" : t.status === "running" ? "La IA no ha dado un número" : "", "tasks"),
      kpiTile(liveRunning(t) ? "Lleva" : t.status === "running" ? "Llevaba" : "Duró", taskDur(t), null, "desde " + when(t.started), "activity"),
      kpiTile("Acciones", t.actions ?? actions.length, null, "Cambios que hizo en el equipo", "bolt"),
      kpiTile("Errores", t.errors ?? fails, null, (t.errors ?? fails) ? "Acciones que fallaron" : "Ninguna falló", "alert")),
    $("h2", { class: "section" }, "Paso a paso", $("span", { class: "count" }, plural(actions.length, "acción", "acciones") + (t.notes?.length ? " · " + plural(t.notes.length, "nota", "notas") : ""))),
    fails ? $("div", { class: "toolbar" }, $("span", { class: "spacer" }),
      $("label", { class: "toggle" }, $("input", { type: "checkbox", checked: S.taskOnlyErrors || null, onchange: e => { S.taskOnlyErrors = e.target.checked; draw(); } }),
        `Solo lo que falló (${fails})`)) : null,
    rows.length ? $("div", { class: "list stream" }, rows) : $("div", { class: "card empty" }, "Sin pasos registrados."),
    $("div", { class: "list-foot" }, "Las notas las escribe la IA; las acciones salen del registro de auditoría del agente, así que muestran lo que hizo de verdad."),

/* ---------- fleet notices (avisos) ---------- */
// The panel keeps the last 300 in memory (lost when it restarts) and long-polls them out:
// GET /api/events once, then ?since=last&wait=60 forever. Seqs start at the clock, so they keep growing across restarts.
const LEVEL = { good: "good", info: "primary", warn: "warn", bad: "bad" };
const evTone = e => LEVEL[e.level] || "neutral";
const evAgo = e => Date.now() - e.time < 864e5 ? ago((Date.now() - e.time) / 1000) : when(e.time);
const unseen = e => e.seq > S.evSeen;
function markSeen() {
  if (S.ev.last <= S.evSeen) return;
  S.evSeen = S.ev.last;
  localStorage.setItem("astrea.evSeen", String(S.evSeen));
}
const lastEvent = key => S.ev.list.findLast(e => e.machine === key);
async function pollEvents() {
  for (;;) {
    try {
      const r = await fetch("/api/events" + (S.ev.loaded ? "?" + q({ since: S.ev.last, wait: 60 }) : ""), { cache: "no-store" });
      if (r.status === 404) { S.ev.status = 404; S.ev.loaded = true; draw(); return; } // panel older than v0.5
      if (!r.ok) throw new Error("HTTP " + r.status);
      const j = await r.json();
      const fresh = (j.events || []).filter(e => e.seq > S.ev.last);
      S.ev.list = S.ev.list.concat(fresh).slice(-300);
      S.ev.last = Math.max(S.ev.last, j.last || 0);
      if (!S.ev.loaded && !localStorage.getItem("astrea.evSeen")) markSeen(); // first visit ever: nothing is "new"
      S.ev.loaded = true; S.ev.err = null;
      if (fresh.length || S.ev.list.length === 0) { if (holdDraw()) drawSidebar(); else draw(); }
    } catch (e) {
      S.ev.err = e.message;
      await new Promise(res => setTimeout(res, 5000));
    }
  }
}

function viewEvents(list) {

  if (S.ev.status === 404) return [head, $("div", { class: "callout t-warn" }, icon("alert"),
    $("div", {}, $("b", {}, "Este panel no tiene avisos"), $("p", {}, "Es anterior a la v0.5: actualízalo para verlos aquí.")))];
  if (!S.ev.loaded) return [head, $("div", { class: "card empty" }, S.ev.err ? "No se pudieron leer los avisos: " + S.ev.err : "Cargando los avisos…")];
  const fresh = S.evOpenSeen ?? S.evSeen;
  return [head,
    $("div", { class: "toolbar" },
      $("span", { class: "muted" }, all.length ? plural(shown.length, "aviso", "avisos") : ""),

    shown.length
      ? $("div", { class: "list feed" }, shown.map(e => $("div", { class: "li t-" + evTone(e) + (e.seq > fresh ? " new" : "") },
          $("span", { class: "when", title: new Date(e.time).toLocaleString() }, evAgo(e)),
          $("div", { class: "what" }, $("p", {}, e.text),
            e.machine ? $("div", { class: "meta" }, $("a", { href: machineHref(e.machine) }, e.machine)) : null))))
      : $("div", { class: "card empty" }, $("h2", {}, all.length ? "Nada de este equipo" : "Sin avisos todavía"),
          $("p", {}, all.length ? "Este equipo no ha avisado de nada desde que arrancó el panel."
            : "Aquí aparecerá cuando un equipo se encienda o se apague, termine un trabajo o una descarga, se caiga un servicio o alguien se siente delante.")),
    $("div", { class: "list-foot" }, "Se actualiza solo. El panel guarda los últimos 300 y los olvida al reiniciarse; los mismos avisos llegan a Telegram y a Hermes."),
  ];

// GET /api/memory → {summary, inventory, notes}. Notes oldest first; by:"panel" = written by the owner, none = the AI.
const memURL = key => "/api/memory?" + q({ machine: key });
const memUI = key => S.mem[key] || (S.mem[key] = { draft: "", refreshing: false, q: "", programs: false, summary: false });
function memReload(key) { const c = S.cache[memURL(key)]; if (c) c.t = 0; draw(); }
function addNote(key) {
  const u = memUI(key), text = u.draft.trim();
  if (!text) return;
  return act("note:" + key, async () => {
    await api("POST", "/api/memory", JSON.stringify({ machine: key, text }));
    u.draft = "";
    memReload(key);
  });
}
function forgetNote(key, id) {
  return act(`forget:${key}:${id}`, async () => {
    await api("DELETE", "/api/memory", JSON.stringify({ machine: key, id }));
    const c = S.cache[memURL(key)];
    if (c?.data?.notes) c.data.notes = c.data.notes.filter(n => n.id !== id);
  });

async function rescan(key) {

    const j = await api("GET", memURL(key) + "&refresh=1");
    S.cache[memURL(key)] = { data: j, t: Date.now(), status: 200 };

}

  const body = tab === "mem" ? tabMemory(m, key) : tab === "svc" ? tabServices(m) : tab === "sys" ? tabSystem(m, s) : tab === "act" ? tabActivity(m, key) : tab === "work" ? tabWork(m, key) : tabPerformance(key, s);
  return [head, callout, locked, working, seg, $("div", { role: "tabpanel" }, body)];
}

function addForm() {
  const a = S.add;
  if (a.ok) {
    const k = a.ok.name;
    return $("div", { class: "callout sm t-good" }, icon("check"),
      $("div", {}, $("b", {}, `${k} ${a.ok.replaced ? "actualizado" : "añadido"}`),
        $("p", {}, [a.ok.hostname, a.ok.os].filter(Boolean).join(" · ") || "Ya está conectado.", a.ok.note ? " " + a.ok.note : "")),
      $("div", { class: "actions" },
        $("a", { class: "btn sm primary", href: machineHref(k) }, "Ver equipo"),
        $("button", { class: "btn sm ghost", onclick: () => { S.add = { text: "", name: "" }; draw(); } }, "Añadir otro")));
  }
  return $("form", { onsubmit: e => { e.preventDefault(); addMachine(); } },
    $("div", { class: "field" },
      $("label", { for: "addText" }, "Ficha del equipo"),
      $("textarea", { id: "addText", class: "input", placeholder: "Pega aquí el contenido de hub-config.txt…", spellcheck: "false", disabled: a.busy || null,
        oninput: e => { S.add.text = e.target.value; } }, a.text)),
    $("div", { class: "field" },
      $("label", { for: "addName" }, "Nombre (opcional)"),
      $("input", { id: "addName", class: "input", value: a.name, placeholder: "Si lo dejas vacío, usa el nombre del equipo", disabled: a.busy || null,
        oninput: e => { S.add.name = e.target.value; } })),
    a.err ? $("div", { class: "callout sm t-bad" }, icon("alert"), $("div", {}, $("b", {}, a.err), a.detail ? $("p", { class: "muted", style: "font-size:12px" }, a.detail) : null)) : null,
    $("div", { style: "margin-top:14px" },
      $("button", { class: "btn primary", type: "submit", disabled: a.busy || null },
        a.busy ? [icon("refresh", "spin"), "Conectando con el equipo…"] : [icon("plus"), "Probar y añadir"])));
}

function viewHelp() {
  const step = (n, title, ...body) => $("div", { class: "card step" }, $("div", { class: "n" }, String(n)), $("h3", {}, title), ...body);
  const term = (tone, label, text) => $("div", { class: "li" }, chip(tone, label), $("div", { class: "v", style: "text-align:left;margin-left:12px" }, text));
  return [
    $("div", { class: "page-head" }, $("div", {}, $("h1", {}, "Añadir un equipo"),
      $("div", { class: "sub" }, "Tres pasos. Solo hay que hacerlos una vez por equipo."))),
    $("div", { class: "steps" },
      step(1, "Conecta los dos equipos a Tailscale",
        $("p", {}, "Instala Tailscale en este ordenador y en el que quieres controlar, con la misma cuenta. Así se ven entre sí aunque estén en casas distintas, sin abrir puertos."),
        $("p", { style: "margin-top:10px" }, $("a", { href: "https://tailscale.com/download", target: "_blank", rel: "noopener" }, "Descargar Tailscale →"))),
      step(2, "Instala el agente en el otro equipo",
        $("p", {}, "En Windows, descarga y abre ", $("b", {}, "astrea-agent.msi"), " desde la última versión. Al terminar deja una ficha con los datos de conexión en ", $("code", {}, "C:\\ProgramData\\Astrea\\hub-config.txt"), "."),
        $("p", { style: "margin-top:10px" }, $("a", { href: "https://github.com/Solar2004/Astrea/releases/latest", target: "_blank", rel: "noopener" }, "Descargar Astrea →"))),
      step(3, "Pega su ficha aquí",
        $("p", {}, "Abre ", $("code", {}, "hub-config.txt"), " en el otro equipo, copia todo y pégalo debajo. Astrea comprobará que responde antes de guardarlo."),
        addForm())),
    $("div", { class: "list-title" }, "Qué significa cada estado"),
    $("div", { class: "list glossary" },
      term("good", "Libre", "Nadie está usando el equipo: tu IA puede trabajar en él sin molestar."),
      term("warn", "En uso", "Hay una persona delante. Mejor no mover el ratón ni ocupar la gráfica."),
      term("bad", "Sin conexión", "El equipo está apagado, sin internet o sin Tailscale."),
      term("bad", "Bloqueada", "Se activó el freno de emergencia: el agente rechaza cualquier orden."),
      $("div", { class: "li" }, modeChip({ mode: "yolo" }), $("div", { class: "v", style: "text-align:left;margin-left:4px" }, "La IA tiene control total: ejecuta, instala y usa el ratón y el teclado sin pedir permiso.")),
      $("div", { class: "li" }, modeChip({ mode: "readonly" }), $("div", { class: "v", style: "text-align:left;margin-left:4px" }, "La IA solo puede mirar: no ejecuta ni cambia nada."))),
    $("div", { class: "list-foot" }, "¿Algo no funciona? Ejecuta astrea-agent --diagnose en el otro equipo; la salida no incluye la clave."),
  ];
}

/* ---------- draw ---------- */
function draw() {
  const r = route();
  if (r.name === "events") { S.evOpenSeen ??= S.evSeen; markSeen(); } else S.evOpenSeen = null;
  drawSidebar();
  const view = document.getElementById("view");
  let content;
  try {
    if (r.name === "help") content = viewHelp();
    else if (r.name === "events") content = viewEvents(S.list || []); // doesn't need the stats
    else if (S.list == null) content = [$("div", { class: "empty" }, S.ok ? "Conectando con los equipos…" : "El panel no responde: " + S.err)];
    else if (r.name === "machine") content = viewMachine(S.list, r.id);
    else if (r.name === "tasks") content = viewTasks(S.list);
    else if (r.name === "task") content = viewTask(r.machine, r.id);
    else content = viewOverview(S.list);
  } catch (e) {
    console.error(e);
    content = [$("div", { class: "callout t-bad" }, icon("alert"), $("div", {}, $("b", {}, "Esta vista ha fallado"),
      $("p", {}, "Es un fallo del panel, no del equipo. Detalle: " + e.message)))];
  }
  view.replaceChildren(...[content].flat(Infinity).filter(Boolean));
  document.title = r.name === "machine" ? r.id + " — Astrea" : r.name === "help" ? "Añadir un equipo — Astrea"
    : r.name === "tasks" ? "Tareas — Astrea" : r.name === "events" ? "Avisos — Astrea" : r.name === "task" ? (S.cache["/api/work?" + q({ machine: r.machine, id: r.id })]?.data?.task?.title || "Tarea") + " — Astrea" : "Astrea";
}

/* ---------- live window ---------- */
// GET /api/live is an MJPEG stream: an <img> plays it, removing its src stops it.
// Taking control (POST /api/control, renewed every 10 s, expires by itself at 30 s) locks the AI
// out of mouse and keyboard; meanwhile clicks, drags, wheel and keys go to POST /api/input.
const shot = document.getElementById("shot"), shotBody = document.getElementById("shotBody");
const live = { machine: "", title: "", img: null, ctl: false, busy: false, renew: 0, chain: Promise.resolve(),
               drag: null, move: null, moveTimer: 0, text: "", textTimer: 0, wheel: 0, wheelTimer: 0, lastErr: 0 };
const BTN = ["left", "middle", "right"];
const QUICK_KEYS = [["Esc", "esc"], ["Tab", "tab"], ["Enter", "enter"], ["Alt+Tab", "alt+tab"], ["Win", "win"], ["Ctrl+C", "ctrl+c"], ["Ctrl+V", "ctrl+v"]];
const liveURL = () => "/api/live?" + q({ machine: live.machine, w: document.getElementById("shotQ").value });
const setWhen = (...k) => document.getElementById("shotWhen").replaceChildren(...k);

function showShot(machine, title) {
  Object.assign(live, { machine, title });
  document.getElementById("shotTitle").textContent = title;
  shot.classList.add("open");
  drawCtl();
  startStream();
  document.getElementById("shotClose").focus();
}
function closeShot() {
  if (!shot.classList.contains("open")) return;
  if (live.ctl) setControl(false);
  stopStream();
  shot.classList.remove("open");
  shotBody.classList.remove("real");
  document.getElementById("shotFit").textContent = "Tamaño real";
}

function startStream() {
  stopStream();
  const img = new Image();
  img.alt = "Pantalla de " + live.title;
  img.draggable = false;
  img.style.display = "none";
  img.onload = () => { img.style.display = ""; shotBody.querySelector(".msg")?.remove();
    setWhen($("span", { class: "live-dot" }, $("span", { class: "dot t-bad pulse" }), "En vivo")); };
  img.onerror = () => diagnose();
  wireInput(img);
  live.img = img;
  shotBody.replaceChildren($("div", { class: "msg" }, "Conectando con la pantalla…"), img);
  setWhen("");
  img.src = liveURL();
}
function stopStream() {
  const img = live.img;
  if (!img) return;
  img.onload = img.onerror = null;
  img.removeAttribute("src"); // closes the stream
  live.img = null;
}
// diagnose: an <img> can't see the HTTP status, so ask once with fetch and drop the body.
async function diagnose() {
  stopStream();
  setWhen("Sin imagen");
  shotBody.replaceChildren($("div", { class: "msg" }, "Comprobando qué pasa…"));
  const ac = new AbortController();
  let title = "No se pudo ver la pantalla", detail = "";
  try {
    const r = await fetch(liveURL(), { signal: ac.signal, cache: "no-store" });
    if (r.ok) { ac.abort(); shotBody.replaceChildren($("div", { class: "msg" }, "Reconectando…")); setTimeout(() => shot.classList.contains("open") && !live.img && startStream(), 1500); return; }
    const t = (await r.text()).trim();
    if (r.status === 501) title = "El agente de este equipo no puede mostrar la pantalla: actualízalo";
    else if (r.status === 502 && /sesi[oó]n|session|sin imagen/i.test(t)) { title = "Nadie ha iniciado sesión"; detail = "Sin una sesión abierta en ese equipo no hay pantalla que mostrar."; }
    else if (/dial|deadline|timeout|unreachable|refused/i.test(t)) { title = "El equipo no responde"; detail = "Puede que se haya apagado o perdido la conexión."; }
    else detail = t;
  } catch (e) { if (e.name !== "AbortError") detail = e.message; }
  shotBody.replaceChildren($("div", { class: "msg" }, $("b", {}, title), detail ? [$("br"), detail] : null, $("br"),
    $("button", { class: "btn sm", onclick: startStream }, icon("refresh"), "Reintentar")));
}

/* control */
function drawCtl() {
  const b = document.getElementById("shotCtl");
  b.disabled = live.busy;
  b.className = "btn sm " + (live.ctl ? "" : "primary");
  b.replaceChildren(...(live.busy ? [icon("refresh", "spin")] : []), live.ctl ? "Soltar el control" : "🕹 Tomar el control");
  document.getElementById("shotCtlBar").hidden = !live.ctl;
  shot.querySelector(".sheet").classList.toggle("ctl", live.ctl);
}
const ctlErr = e => e.status === 501 ? `El agente de ${live.machine} no permite tomar el control: actualízalo.` : "No se pudo tomar el control: " + e.message;
async function setControl(on) {
  const machine = live.machine;
  clearInterval(live.renew);
  if (!on) { // also on close / page exit: keepalive lets it finish after the page is gone
    flushText();
    live.ctl = false; drawCtl();
    fetch("/api/control", { method: "POST", body: JSON.stringify({ machine, on: false }), keepalive: true }).catch(() => {});
    return;
  }
  live.busy = true; drawCtl();
  try {
    await api("POST", "/api/control", JSON.stringify({ machine, on: true }));
    live.ctl = true;
    shotBody.focus();
    live.renew = setInterval(() => api("POST", "/api/control", JSON.stringify({ machine, on: true, renew: true }))
      .catch(e => { if (live.ctl && live.machine === machine) { clearInterval(live.renew); live.ctl = false; drawCtl(); toast("Se perdió el control: " + e.message, "bad"); } }), 10000);
  } catch (e) { toast(ctlErr(e), "bad"); }
  finally { live.busy = false; drawCtl(); }
}
addEventListener("pagehide", () => { if (live.ctl) setControl(false); });

/* input: sent one by one, in order */
function send(o) {
  const body = JSON.stringify({ machine: live.machine, ...o });
  live.chain = live.chain.then(() => api("POST", "/api/input", body)).catch(e => {
    if (Date.now() - live.lastErr < 4000) return; // one toast per burst of failures
    live.lastErr = Date.now();
    toast(e.status === 501 ? `El agente de ${live.machine} no acepta control remoto: actualízalo.` : e.status === 409 ? "Abre la vista en vivo antes de controlar." : "No llegó al equipo: " + e.message, "bad");
  });
}
function pos(e, img) {
  const r = img.getBoundingClientRect();
  return { fx: Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), fy: Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)) };
}
function sendMove(p) { // throttled to ~10/s while dragging
  live.move = p;
  if (!live.moveTimer) live.moveTimer = setTimeout(() => { live.moveTimer = 0; send({ type: "move", ...live.move }); }, 100);
}
function typeText(t) { live.text += t; clearTimeout(live.textTimer); live.textTimer = setTimeout(flushText, 250); }
function flushText() { clearTimeout(live.textTimer); if (live.text) { send({ type: "text", text: live.text }); live.text = ""; } }

function wireInput(img) {
  img.addEventListener("click", () => { if (!live.ctl) toggleFit(); });
  img.addEventListener("contextmenu", e => { if (live.ctl) e.preventDefault(); });
  img.addEventListener("pointerdown", e => {
    if (!live.ctl) return;
    e.preventDefault(); shotBody.focus(); flushText();
    live.drag = { button: BTN[e.button] || "left", x: e.clientX, y: e.clientY, p: pos(e, img), moved: false };
    img.setPointerCapture(e.pointerId);
  });
  img.addEventListener("pointermove", e => {
    const d = live.drag;
    if (!live.ctl || !d) return;
    if (!d.moved && Math.hypot(e.clientX - d.x, e.clientY - d.y) > 5) { d.moved = true; send({ type: "down", ...d.p, button: d.button }); }
    if (d.moved) sendMove(pos(e, img));
  });
  img.addEventListener("pointerup", e => {
    const d = live.drag;
    live.drag = null;
    if (!live.ctl || !d) return;
    if (!d.moved) return send({ type: "click", ...d.p, button: d.button });
    clearTimeout(live.moveTimer); live.moveTimer = 0;
    send({ type: "up", ...pos(e, img), button: d.button });
  });
  img.addEventListener("wheel", e => {
    if (!live.ctl) return;
    e.preventDefault();
    live.wheel += e.deltaY * (e.deltaMode === 1 ? 33 : e.deltaMode === 2 ? 400 : 1);
    const p = pos(e, img);
    if (!live.wheelTimer) live.wheelTimer = setTimeout(() => {
      const n = Math.trunc(live.wheel / 100) || Math.sign(live.wheel); // notches; a touchpad flick still moves one
      live.wheel = 0; live.wheelTimer = 0;
      if (n) send({ type: "scroll", ...p, dy: n });
    }, 120);
  }, { passive: false });
}

// keyFor: a keydown as {text} (typed as is, in bursts) or {keys:"ctrl+c"} (key.press names).
const SPECIAL = { Enter: "enter", Escape: "esc", Tab: "tab", Backspace: "backspace", Delete: "delete", Insert: "insert", Home: "home", End: "end",
  PageUp: "pageup", PageDown: "pagedown", ArrowLeft: "left", ArrowUp: "up", ArrowRight: "right", ArrowDown: "down", ContextMenu: "menu" };
function keyFor(e) {
  if (["Control", "Shift", "Alt", "Meta", "AltGraph", "CapsLock", "Dead", "Unidentified"].includes(e.key)) return null;
  const altgr = e.getModifierState?.("AltGraph"); // @, #, € on Spanish keyboards are text, not ctrl+alt
  const mods = [];
  if (e.ctrlKey && !altgr) mods.push("ctrl");
  if (e.altKey && !altgr) mods.push("alt");
  if (e.metaKey) mods.push("win");
  if (e.key.length === 1 && !mods.length) return { text: e.key };
  let base = SPECIAL[e.key] || (/^F([1-9]|1[0-2])$/.test(e.key) ? e.key.toLowerCase() : null);
  if (!base && mods.length) {
    const m = /^(?:Key([A-Z])|Digit(\d))$/.exec(e.code) || (e.key === " " ? [, , "space"] : null);
    if (m) base = (m[1] || m[2]).toLowerCase();
  }
  if (!base) return null;
  if (e.shiftKey) mods.push("shift");
  return { keys: [...mods, base].join("+") };
}
shotBody.addEventListener("keydown", e => {
  if (!live.ctl) return;
  const k = keyFor(e);
  if (!k) return;
  e.preventDefault(); e.stopPropagation(); // Esc goes to the PC, it doesn't close the window
  if (k.text != null) typeText(k.text);
  else { flushText(); send({ type: "key", keys: k.keys }); }
});
document.getElementById("shotKeys").replaceChildren(...QUICK_KEYS.map(([label, keys]) =>
  $("button", { class: "btn sm", onclick: () => { flushText(); send({ type: "key", keys }); shotBody.focus(); } }, label)));

function toggleFit() {
  const real = shotBody.classList.toggle("real");
  document.getElementById("shotFit").textContent = real ? "Ajustar" : "Tamaño real";
}
document.getElementById("shotFit").onclick = toggleFit;
document.getElementById("shotClose").onclick = closeShot;
document.getElementById("shotCtl").onclick = () => setControl(!live.ctl);
document.getElementById("shotQ").onchange = startStream;
shot.addEventListener("click", e => { if (e.target === shot && !live.ctl) closeShot(); }); // with control, only the X closes it
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeShot(); logs.classList.remove("open"); document.getElementById("app").classList.remove("nav-open"); } });

/* ---------- mobile drawer ---------- */
const app = document.getElementById("app");
document.getElementById("menuBtn").onclick = () => app.classList.add("nav-open");
document.getElementById("scrim").onclick = () => app.classList.remove("nav-open");
let lastPath = "";
window.addEventListener("hashchange", () => {
  app.classList.remove("nav-open"); S.pending = null; draw();
  const r = route(), path = r.name + (r.machine || "") + (r.id || "");
  if (path !== lastPath) window.scrollTo(0, 0); // switching tabs keeps the scroll
  lastPath = path;
});

/* ---------- polling ---------- */
// Don't rebuild the view under the cursor (chart tooltip) or under a form being filled.
// Nor mid-click: replacing the button between mousedown and mouseup swallows the click.
let pressing = false;
addEventListener("pointerdown", () => { pressing = true; }, true);
addEventListener("pointerup", () => { pressing = false; }, true);
addEventListener("pointercancel", () => { pressing = false; }, true);
const holdDraw = () => !!(pressing || document.querySelector(".spark svg:hover") || route().name === "help" ||
                          document.activeElement?.matches?.("input, textarea, select"));
async function loop() {
  try {
    const r = await fetch("/api/stats", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    S.list = await r.json();
    S.ok = true; S.updatedAt = Date.now();
    recordAll(S.list, S.updatedAt);
  } catch (e) {
    S.ok = false; S.err = e.message;
  }
  if (holdDraw()) drawSidebar(); else draw();
  setTimeout(loop, POLL_MS);
}
loadVersion().then(draw);
setInterval(loadVersion, 5 * 60 * 1000);
loop();
pollEvents();
</script>
</body>
