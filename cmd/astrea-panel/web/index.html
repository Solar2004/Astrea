<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Astrea</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Astrea">
<meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0E12" media="(prefers-color-scheme: dark)">
<style>
  /* Tokens — see docs/DESIGN.md. Status colors always ship with a text label. */
  :root {
    color-scheme: light;
    --bg: #F5F5F7;
    --sidebar: rgba(240, 240, 244, .78);
    --surface: #FFFFFF;
    --surface-2: #F1F1F4;
    --surface-3: #E7E7EC;
    --border: rgba(0, 0, 0, .08);
    --divider: rgba(0, 0, 0, .06);
    --track: #ECECF0;
    --text: #1D1D1F;
    --text-2: #515154;
    --text-3: #86868B;
    --primary: #5B4BDB;
    --primary-hover: #4C3CCB;
    --primary-soft: rgba(91, 75, 219, .10);
    --primary-area: rgba(91, 75, 219, .12);
    --on-primary: #FFFFFF;
    --good: #12A150;
    --warn: #B7791F;
    --bad: #E5484D;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .04), 0 1px 1px rgba(0, 0, 0, .02);
    --shadow-md: 0 2px 6px rgba(0, 0, 0, .04), 0 10px 28px rgba(0, 0, 0, .07);
    --shadow-lg: 0 24px 64px rgba(0, 0, 0, .22);
    --radius: 16px;
    --radius-sm: 10px;
    --sidebar-w: 256px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #0E0E12;
      --sidebar: rgba(22, 22, 28, .72);
      --surface: #18181D;
      --surface-2: #222229;
      --surface-3: #2C2C34;
      --border: rgba(255, 255, 255, .08);
      --divider: rgba(255, 255, 255, .06);
      --track: #2A2A32;
      --text: #F5F5F7;
      --text-2: #B4B4BC;
      --text-3: #7C7C86;
      --primary: #8B7CFF;
      --primary-hover: #9D90FF;
      --primary-soft: rgba(139, 124, 255, .16);
      --primary-area: rgba(139, 124, 255, .20);
      --on-primary: #0E0E12;
      --good: #45D483;
      --warn: #F5A524;
      --bad: #FF6369;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
      --shadow-md: 0 2px 6px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .35);
      --shadow-lg: 0 24px 64px rgba(0, 0, 0, .6);
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--primary); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 6px; }
  .num, .tnum { font-variant-numeric: tabular-nums; }
  .icon { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .muted { color: var(--text-3); }
  .spacer { flex: 1; }

  /* ---------- layout ---------- */
  .app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: 100vh; }
  .sidebar {
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
    display: flex; flex-direction: column; gap: 4px;
    padding: 18px 12px 14px;
    background: var(--sidebar); border-right: 1px solid var(--border);
    -webkit-backdrop-filter: saturate(180%) blur(24px); backdrop-filter: saturate(180%) blur(24px);
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; font-weight: 700; font-size: 17px; letter-spacing: -.01em; color: var(--text); }
  .brand img { width: 28px; height: 28px; border-radius: 7px; }
  .brand:hover { text-decoration: none; }
  .nav-label { font-size: 11px; font-weight: 600; color: var(--text-3); letter-spacing: .02em; padding: 14px 10px 6px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; min-height: 36px;
    padding: 6px 10px; border-radius: var(--radius-sm); color: var(--text); font-weight: 500;
  }
  .nav-item:hover { background: var(--surface-3); text-decoration: none; }
  .nav-item[aria-current="page"] { background: var(--primary-soft); color: var(--primary); }
  .nav-item .icon { color: var(--text-2); }
  .nav-item[aria-current="page"] .icon { color: var(--primary); }
  .nav-item .two { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
  .nav-item .two b { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav-item .two small { font-size: 11.5px; color: var(--text-3); }
  .nav-item .end { margin-left: auto; font-size: 12px; color: var(--text-3); }
  .sidebar .foot { margin-top: auto; padding: 12px 10px 0; border-top: 1px solid var(--divider); font-size: 12px; color: var(--text-3); display: grid; gap: 4px; }
  .sidebar .foot .row { display: flex; align-items: center; gap: 6px; }

  .main { min-width: 0; }
  .topbar, .scrim { display: none; }
  .view { max-width: 1240px; margin: 0 auto; padding: 32px 40px 64px; }

  /* ---------- status dot + chips (HeroUI "flat" chip) ---------- */
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--text-3); }
  .t-good { --tone: var(--good); } .t-warn { --tone: var(--warn); } .t-bad { --tone: var(--bad); }
  .t-primary { --tone: var(--primary); } .t-neutral { --tone: var(--text-3); }
  .dot[class*="t-"] { background: var(--tone); }
  .dot.pulse { box-shadow: 0 0 0 0 var(--tone); animation: pulse 2.4s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--tone) 55%, transparent); } 70%, 100% { box-shadow: 0 0 0 6px transparent; } }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px;
    border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap;
    color: color-mix(in srgb, var(--tone, var(--text-3)) 88%, var(--text));
    background: color-mix(in srgb, var(--tone, var(--text-3)) 14%, transparent);
  }
  .chip .dot { width: 6px; height: 6px; background: var(--tone, var(--text-3)); }
  .chip .icon { width: 13px; height: 13px; stroke-width: 2.2; margin-left: -2px; }

  /* ---------- buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    height: 36px; padding: 0 14px; border-radius: var(--radius-sm); border: 0; cursor: pointer;
    background: var(--surface-2); color: var(--text); font-weight: 600; font-size: 13.5px;
    transition: background .15s, transform .1s;
  }
  .btn:hover { background: var(--surface-3); text-decoration: none; }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .5; cursor: default; transform: none; }
  .btn.primary { background: var(--primary); color: var(--on-primary); }
  .btn.primary:hover { background: var(--primary-hover); }
  .btn.danger { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
  .btn.ghost { background: transparent; }
  .btn.ghost:hover { background: var(--surface-2); }
  .btn.sm { height: 30px; padding: 0 11px; font-size: 12.5px; }
  .btn.icon-only { width: 36px; padding: 0; }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- page header ---------- */
  .crumbs { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-3); margin-bottom: 6px; }
  .crumbs a { color: var(--text-3); }
  .page-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 16px; margin-bottom: 24px; }
  .page-head h1 { margin: 0; font-size: 30px; line-height: 1.15; font-weight: 700; letter-spacing: -.022em; }
  .page-head .sub { color: var(--text-2); margin-top: 4px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .page-head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  h2.section { font-size: 17px; font-weight: 650; letter-spacing: -.01em; margin: 32px 0 12px; display: flex; align-items: center; gap: 8px; }
  h2.section .count { font-size: 13px; color: var(--text-3); font-weight: 500; }

  /* ---------- cards ---------- */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow-sm); min-width: 0; }
  .card h3 { margin: 0; font-size: 13px; font-weight: 600; color: var(--text-2); display: flex; align-items: center; gap: 8px; }
  .card .model { color: var(--text-3); font-size: 12.5px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .wide { grid-column: 1 / -1; }

  /* KPI tiles */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
  .kpi .label { font-size: 13px; color: var(--text-2); font-weight: 500; display: flex; align-items: center; gap: 7px; }
  .kpi .value { font-size: 34px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; margin-top: 8px; font-variant-numeric: tabular-nums; }
  .kpi .value small { font-size: 18px; color: var(--text-3); font-weight: 600; }
  .kpi .hint { font-size: 12px; color: var(--text-3); margin-top: 2px; }

  /* machine cards on the overview */
  a.mcard { display: flex; flex-direction: column; gap: 14px; color: inherit; transition: transform .15s, box-shadow .15s, border-color .15s; }
  a.mcard:hover { text-decoration: none; transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: color-mix(in srgb, var(--primary) 35%, var(--border)); }
  a.mcard.off { background: color-mix(in srgb, var(--surface) 60%, var(--bg)); }
  .mcard .top { display: flex; align-items: center; gap: 12px; }
  .os-tile { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; flex: none; background: var(--primary-soft); color: var(--primary); }
  .os-tile .icon { width: 22px; height: 22px; }
  .mcard.off .os-tile { background: var(--surface-2); color: var(--text-3); }
  .mcard .who { min-width: 0; }
  .mcard .who b { display: block; font-size: 16px; font-weight: 650; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mcard .who small { color: var(--text-3); font-size: 12.5px; }
  .mcard .chev { margin-left: auto; color: var(--text-3); }
  .bars { display: grid; grid-template-columns: 38px 1fr 40px; gap: 7px 10px; align-items: center; font-size: 12.5px; }
  .bars .k { color: var(--text-3); font-weight: 500; }
  .bars .v { text-align: right; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .mcard .bottom { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-top: 12px; border-top: 1px solid var(--divider); font-size: 12.5px; color: var(--text-2); }
  .mcard .off-msg { color: var(--text-3); font-size: 13px; }
  .mcard .bottom { margin-top: auto; }
  .glossary .li .chip { min-width: 112px; justify-content: flex-start; }
  .glossary .li .v { margin-left: 4px !important; }

  /* meters (4px rounded data-ends, anchored to the baseline) */
  .meter { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; }
  .meter.thin { height: 6px; }
  .meter > span { display: block; height: 100%; border-radius: 4px; background: var(--primary); transition: width .5s cubic-bezier(.2, .8, .2, 1); }
  .meter.hot > span { background: var(--bad); }

  /* metric cards (machine view) */
  .hero { display: flex; align-items: baseline; gap: 10px; margin: 14px 0 10px; }
  .hero .big { font-size: 34px; font-weight: 700; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
  .hero .detail { color: var(--text-2); font-size: 13px; font-variant-numeric: tabular-nums; }
  .spark { position: relative; margin-top: 14px; }
  .spark svg { display: block; width: 100%; height: 64px; overflow: visible; }
  .spark .tip { position: absolute; top: -6px; transform: translate(-50%, -100%); pointer-events: none;
                background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
                padding: 4px 8px; font-size: 12px; white-space: nowrap; box-shadow: var(--shadow-md);
                display: none; font-variant-numeric: tabular-nums; }
  .spark .axis { display: flex; justify-content: space-between; color: var(--text-3); font-size: 11px; margin-top: 4px; }
  .cores-label { color: var(--text-3); font-size: 11.5px; margin: 14px 0 6px; }
  .cores { display: flex; gap: 2px; height: 36px; }
  .cores span { flex: 1; min-width: 0; display: flex; align-items: flex-end; background: var(--track); border-radius: 3px; overflow: hidden; }
  .cores span i { display: block; width: 100%; background: var(--primary); min-height: 1px; border-radius: 3px 3px 0 0; }
  .disk + .disk { margin-top: 14px; }
  .disk .row { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; margin-bottom: 6px; }
  .disk .row .v { color: var(--text-2); font-variant-numeric: tabular-nums; }

  /* segmented control (Apple) */
  .segmented { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; margin-bottom: 18px; }
  .segmented button { border: 0; background: transparent; padding: 6px 16px; border-radius: 8px; font-weight: 600; font-size: 13px; color: var(--text-2); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  .segmented button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm), 0 0 0 1px var(--border); }
  .segmented .n { font-size: 11px; color: var(--text-3); font-weight: 600; }

  /* inset grouped list (iOS Settings) */
  .list { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); overflow: hidden; }
  .list .li { display: flex; align-items: center; gap: 12px; padding: 13px 16px; min-height: 52px; position: relative; }
  .list .li + .li::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: 1px solid var(--divider); }
  .list .li .k { color: var(--text); font-weight: 500; }
  .list .li .k small { display: block; color: var(--text-3); font-weight: 400; font-size: 12px; margin-top: 1px; }
  .list .li .v { margin-left: auto; color: var(--text-2); text-align: right; font-variant-numeric: tabular-nums; }
  .list-title { font-size: 12px; font-weight: 600; color: var(--text-3); letter-spacing: .02em; margin: 24px 4px 8px; text-transform: uppercase; }
  [role="tabpanel"] > .list-title:first-child { margin-top: 4px; }
  .list-foot { font-size: 12px; color: var(--text-3); margin: 8px 4px 0; }

  /* callouts / banners */
  .callout { display: flex; gap: 14px; align-items: flex-start; padding: 16px 18px; border-radius: var(--radius);
             background: color-mix(in srgb, var(--tone, var(--primary)) 9%, var(--surface)); border: 1px solid color-mix(in srgb, var(--tone, var(--primary)) 25%, var(--border)); margin-bottom: 18px; }
  .callout > .icon { color: var(--tone, var(--primary)); width: 22px; height: 22px; margin-top: 1px; }
  .callout b { display: block; margin-bottom: 2px; }
  .callout p { margin: 0; color: var(--text-2); }
  .callout ul { margin: 8px 0 0; padding-left: 18px; color: var(--text-2); }
  .callout .actions { margin-left: auto; display: flex; gap: 8px; align-self: center; flex-wrap: wrap; }

  /* empty states */
  .empty { text-align: center; padding: 56px 24px; color: var(--text-2); }
  .empty img { width: 72px; height: 72px; border-radius: 18px; box-shadow: var(--shadow-md); }
  .empty h2 { color: var(--text); font-size: 22px; letter-spacing: -.015em; margin: 18px 0 6px; }
  .empty p { margin: 0 auto 18px; max-width: 440px; }
  .empty-sm { color: var(--text-3); font-size: 13px; padding: 8px 0; }

  /* services */
  .svc .li .nm { font-weight: 600; }
  .svc .li .meta { color: var(--text-3); font-size: 12px; }

  /* help */
  .steps { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .step .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); font-weight: 700; font-size: 13px; margin-bottom: 12px; }
  .step h3 { font-size: 15px; color: var(--text); margin-bottom: 6px; }
  .step p { margin: 0; color: var(--text-2); font-size: 13.5px; }
  code, pre { font-family: "SF Mono", "Geist Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
  pre { background: var(--surface-2); padding: 12px 14px; border-radius: var(--radius-sm); overflow-x: auto; margin: 10px 0 0; white-space: pre; }
  :not(pre) > code { background: var(--surface-2); padding: 1px 6px; border-radius: 6px; }

  /* screen viewer (sheet) */
  .sheet-bg { position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center;
              background: rgba(0, 0, 0, .45); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); padding: 24px; }
  .sheet-bg.open { display: flex; animation: fade .18s ease-out; }
  .sheet { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow-lg); border: 1px solid var(--border);
           max-width: min(1320px, 96vw); max-height: 94vh; display: flex; flex-direction: column; overflow: hidden; animation: rise .22s cubic-bezier(.2, .8, .2, 1); }
  .sheet .bar { display: flex; align-items: center; gap: 10px; padding: 12px 14px 12px 20px; border-bottom: 1px solid var(--divider); }
  .sheet .bar h3 { margin: 0; font-size: 15px; font-weight: 650; }
  .sheet .bar small { color: var(--text-3); font-size: 12px; }
  .sheet .body { padding: 14px; display: flex; align-items: center; justify-content: center; min-width: min(640px, 90vw); min-height: 300px; background: var(--bg); overflow: auto; }
  /* Fit: the whole screen always visible, never cropped. Real size: scroll around it. */
  .sheet img { display: block; width: auto; height: auto; max-width: calc(96vw - 28px); max-height: calc(94vh - 92px); object-fit: contain; border-radius: 10px; box-shadow: var(--shadow-md); cursor: zoom-in; }
  .sheet .body.real { display: block; max-width: 96vw; max-height: calc(94vh - 64px); }
  .sheet .body.real img { max-width: none; max-height: none; cursor: zoom-out; }
  .sheet .msg { color: var(--text-2); padding: 40px; text-align: center; }
  .sheet .msg .btn { margin-top: 14px; }
  .sheet .body:focus { outline: none; }
  .live-dot { display: inline-flex; align-items: center; gap: 6px; }
  /* Taking control: an amber ring around the whole window, so it's never ambiguous who drives the mouse */
  .sheet.ctl { box-shadow: 0 0 0 3px var(--warn), var(--shadow-lg); }
  .sheet.ctl img { cursor: default; touch-action: none; max-height: calc(94vh - 140px); }
  .ctl-bar { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; padding: 8px 14px 8px 20px; font-size: 13px;
             background: color-mix(in srgb, var(--warn) 14%, var(--surface)); border-bottom: 1px solid var(--divider); }
  .ctl-bar[hidden] { display: none; }
  .ctl-bar b { color: color-mix(in srgb, var(--warn) 65%, var(--text)); }
  .ctl-bar .keys { margin-left: auto; display: flex; gap: 4px; flex-wrap: wrap; }
  .ctl-bar .keys .btn { height: 26px; padding: 0 9px; font-size: 12px; background: var(--surface); }
  .toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); cursor: pointer; user-select: none; }
  .toggle input { appearance: none; width: 36px; height: 22px; border-radius: 999px; background: var(--surface-3); position: relative; cursor: pointer; transition: background .2s; margin: 0; }
  .toggle input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
  .toggle input:checked { background: var(--good); }
  .toggle input:checked::after { transform: translateX(14px); }

  /* toasts */
  .toasts { position: fixed; right: 20px; bottom: 20px; display: grid; gap: 8px; z-index: 40; }
  .toast { display: flex; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
           padding: 12px 16px; box-shadow: var(--shadow-md); max-width: 380px; animation: rise .22s cubic-bezier(.2, .8, .2, 1); }
  .toast .icon { color: var(--tone); }

  /* activity timeline */
  .timeline .li { align-items: flex-start; }
  .timeline .when { width: 64px; flex: none; color: var(--text-3); font-size: 12px; padding-top: 2px; font-variant-numeric: tabular-nums; }
  .timeline .what { min-width: 0; flex: 1; }
  .timeline .what b { font-weight: 600; }
  .timeline .what code { display: block; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-2); background: none; padding: 0; }
  .timeline .what .err { color: var(--bad); font-size: 12.5px; margin-top: 3px; }
  .toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }

  /* forms */
  .field { display: grid; gap: 6px; margin-top: 12px; }
  .field label { font-size: 12.5px; font-weight: 600; color: var(--text-2); }
  .input { width: 100%; font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid transparent; border-radius: var(--radius-sm); padding: 9px 12px; transition: border-color .15s, background .15s; }
  .input:focus { outline: none; border-color: var(--primary); background: var(--surface); box-shadow: 0 0 0 3px var(--primary-soft); }
  textarea.input { min-height: 110px; resize: vertical; font-family: "SF Mono", "Geist Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }

  .svc .li .acts { display: flex; gap: 6px; align-items: center; }
  .logs { margin: 0; max-height: 70vh; min-width: min(900px, 90vw); overflow: auto; white-space: pre-wrap; word-break: break-all; background: var(--bg); border-radius: 0; padding: 14px 18px; }

  /* AI tasks: what the AI says it is doing, and what it actually did under it */
  .task-strip { display: grid; gap: 7px; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--primary-soft); font-size: 12.5px; }
  .task-strip .row { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .task-strip .icon { width: 15px; height: 15px; color: var(--primary); }
  .task-strip b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .task-strip .v { margin-left: auto; color: var(--text-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .task-strip .meter { background: color-mix(in srgb, var(--primary) 16%, transparent); }
  .tasks .li { color: inherit; }
  a.li:hover { background: var(--surface-2); text-decoration: none; }
  .st-tile { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; flex: none;
             color: var(--tone); background: color-mix(in srgb, var(--tone) 14%, transparent); }
  .st-tile .icon { width: 18px; height: 18px; }
  .tasks .what { min-width: 0; flex: 1; display: grid; gap: 3px; }
  .tasks .what b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tasks .what .meta { color: var(--text-3); font-size: 12px; display: flex; flex-wrap: wrap; gap: 0 10px; font-variant-numeric: tabular-nums; }
  .tasks .what .meta .bad { color: var(--bad); }
  .tasks .what .meter { max-width: 260px; margin-top: 3px; }
  .tasks .chev { color: var(--text-3); }
  .task-desc { color: var(--text-2); margin: -10px 0 18px; max-width: 760px; white-space: pre-wrap; }
  .stream .li { align-items: flex-start; }
  .stream .when { width: 64px; flex: none; color: var(--text-3); font-size: 12px; padding-top: 2px; font-variant-numeric: tabular-nums; }
  .stream .mark { width: 22px; flex: none; display: grid; place-items: center; padding-top: 1px; color: var(--text-3); }
  .stream .mark .icon { width: 16px; height: 16px; }
  .stream .what { min-width: 0; flex: 1; }
  .stream .what b { font-weight: 600; }
  .stream .what code { display: block; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-2); background: none; padding: 0; }
  .stream .what .err { color: var(--bad); font-size: 12.5px; margin-top: 3px; }
  .stream .li.note { background: color-mix(in srgb, var(--primary) 6%, var(--surface)); }
  .stream .li.note .mark, .stream .li.edge .mark { color: var(--primary); }
  .stream .li.note .what p { margin: 2px 0 0; color: var(--text); white-space: pre-wrap; }
  .stream .li.fail .mark { color: var(--bad); }
  .task-link { display: inline-flex; align-items: center; gap: 4px; margin-top: 4px; font-size: 12px; font-weight: 500; max-width: 100%; }
  .task-link .icon { width: 13px; height: 13px; }
  .task-link span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .input.sel { width: auto; padding: 6px 10px; font-size: 13px; }

  /* machine memory: notes (AI / you) + inventory */
  .note-form { display: flex; gap: 10px; align-items: flex-end; margin-bottom: 12px; }
  .note-form .btn { white-space: nowrap; height: 44px; }
  .note-form textarea.input { min-height: 44px; height: 44px; font: inherit; resize: vertical; }
  .notes .li { align-items: flex-start; }
  .notes .who-tile { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; flex: none; font-size: 17px; background: var(--surface-2); }
  .notes .who-tile.you { background: var(--primary-soft); }
  .notes .what { min-width: 0; flex: 1; }
  .notes .what p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .notes .what .meta { color: var(--text-3); font-size: 12px; margin-top: 4px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
  .notes .what .meta .chip { height: 20px; padding: 0 8px; font-size: 11px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  .chips .chip.miss { text-decoration: line-through; opacity: .75; }
  details.fold { margin-top: 12px; }
  details.fold > summary { cursor: pointer; font-weight: 600; color: var(--text-2); padding: 6px 4px; list-style-position: inside; }
  details.fold .input { margin: 8px 0; max-width: 320px; }
  .programs { columns: 260px auto; column-gap: 24px; font-size: 13px; color: var(--text-2); padding: 12px 16px; }
  .programs div { break-inside: avoid; padding: 2px 0; }

  /* fleet notices (avisos): the text already carries its emoji; the tone is a bar on the left */
  .feed .li { align-items: flex-start; gap: 10px; }
  .feed .li::after { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--tone); }
  .feed .when { width: 78px; flex: none; white-space: nowrap; color: var(--text-3); font-size: 12px; padding-top: 2px; font-variant-numeric: tabular-nums; }
  .feed .what { min-width: 0; flex: 1; }
  .feed .what p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .feed .what .meta { color: var(--text-3); font-size: 12px; margin-top: 3px; display: flex; flex-wrap: wrap; gap: 0 10px; }
  .feed .li.new { background: color-mix(in srgb, var(--primary) 6%, var(--surface)); }
  .feed .li.new .when { color: var(--primary); font-weight: 600; }
  .mcard .notice { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 12.5px; color: var(--text-2); margin-top: -4px; }
  .mcard .notice .txt { min-width: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mcard .notice > .icon { width: 14px; height: 14px; color: var(--text-3); }
  .mcard .notice .ago { flex: none; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .nav-item .badge { margin-left: auto; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--primary); color: var(--on-primary); font-size: 11px; font-weight: 700; display: grid; place-items: center; }


  /* overview: view switch, groups (collapsible), offline machines apart */
  .ov-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 32px 0 6px; }
  .ov-bar h2.section { margin: 0; }
  .ov-bar .segmented, .toolbar .segmented { margin: 0; }
  .segmented.sm button { padding: 5px 11px; font-size: 12.5px; }
  .segmented button .icon { width: 15px; height: 15px; }
  .segmented button:disabled { opacity: .45; cursor: default; }
  details.group { margin-top: 14px; }
  details.group > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 8px 4px; margin-bottom: 8px;
                            font-size: 15px; font-weight: 650; letter-spacing: -.01em; user-select: none; border-radius: var(--radius-sm); }
  details.group > summary::-webkit-details-marker { display: none; }
  details.group > summary:hover { background: var(--surface-2); }
  details.group > summary .tw { width: 16px; height: 16px; color: var(--text-3); transition: transform .15s; }
  details.group[open] > summary .tw { transform: rotate(90deg); }
  details.group > summary .count { font-size: 13px; color: var(--text-3); font-weight: 500; }
  details.group.off { margin-top: 28px; }
  details.group.off > summary { color: var(--text-2); }
  .empty-group { color: var(--text-3); font-size: 13px; padding: 4px 6px 8px; }

  /* machine card: the screen on top, compact data below */
  a.mcard { padding: 0; gap: 0; overflow: hidden; position: relative; }
  .mcard .mbody { display: flex; flex-direction: column; gap: 12px; padding: 4px 14px 12px; flex: 1; position: relative; z-index: 1; }
  /* The banner shows 3/4 of the screen; the rest runs on behind the text, fading into the card. */
  .mcard .thumb { aspect-ratio: 64 / 27; overflow: visible; }
  .mcard .thumb img { height: 133.34%; bottom: auto; object-position: top; }
  .mcard .thumb::after { content: ""; position: absolute; left: 0; right: 0; top: 30%; height: 103.34%; pointer-events: none;
                         background: linear-gradient(to bottom, transparent 0%, color-mix(in srgb, var(--surface) 72%, transparent) 42%, var(--surface) 72%); }
  .mcard .thumb .over { z-index: 2; }
  .mcard .thumb .ph { position: relative; z-index: 2; }
  .mcard .top { gap: 10px; }
  .mcard .who b { font-size: 15px; }
  .mcard .bottom { padding-top: 10px; }
  .thumb { position: relative; aspect-ratio: 16 / 9; background: var(--surface-2); overflow: hidden; display: grid; place-items: center; }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .ph { color: var(--text-3); font-size: 12.5px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding: 0 12px; }
  .thumb .ph .icon { width: 26px; height: 26px; }
  .thumb .over { position: absolute; left: 8px; right: 8px; top: 8px; display: flex; gap: 6px; align-items: center; pointer-events: none; }
  .thumb .over .chip { background: color-mix(in srgb, var(--surface) 86%, transparent); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); box-shadow: var(--shadow-sm); }
  .thumb .over .chip.t-primary { color: var(--primary); }
  .thumb .over .chip .icon { width: 12px; height: 12px; }
  .thumb .over .chip.t-good { color: var(--good); } .thumb .over .chip.t-warn { color: var(--warn); } .thumb .over .chip.t-bad { color: var(--bad); }
  .mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; font-size: 12px; margin-bottom: 2px; }
  .mini .k { display: flex; justify-content: space-between; color: var(--text-3); margin-bottom: 4px; }
  .mini .k b { color: var(--text-2); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* activity squares (GitHub / Claude Code style): one per day, or per hour in the history */
  .sq-wrap { display: grid; gap: 4px; }
  .sq-wrap .lbl { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-3); }
  .sq { display: flex; gap: 2px; }
  .sq i, .hgrid i { display: block; border-radius: 2px; background: var(--track); }
  .sq i { flex: 1; min-width: 0; aspect-ratio: 1; max-width: 14px; }
  .sq i.on, .hgrid i.on { background: color-mix(in srgb, var(--good) 30%, var(--track)); }
  .sq i.l1, .hgrid i.l1 { background: color-mix(in srgb, var(--primary) 35%, var(--track)); }
  .sq i.l2, .hgrid i.l2 { background: color-mix(in srgb, var(--primary) 60%, var(--track)); }
  .sq i.l3, .hgrid i.l3 { background: color-mix(in srgb, var(--primary) 82%, var(--track)); }
  .sq i.l4, .hgrid i.l4 { background: var(--primary); }
  .hgrid i.crash { box-shadow: inset 0 0 0 2px var(--bad); }
  .hgrid { display: grid; grid-template-columns: 64px repeat(24, minmax(0, 1fr)); gap: 3px; align-items: center; font-size: 11px; color: var(--text-3); }
  .hgrid i { aspect-ratio: 1; max-height: 22px; }
  .hgrid .day { white-space: nowrap; padding-right: 6px; font-variant-numeric: tabular-nums; }
  .hgrid .hr { text-align: left; font-variant-numeric: tabular-nums; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 12px; color: var(--text-3); margin-top: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 11px; height: 11px; border-radius: 2px; display: inline-block; background: var(--track); }

  /* list view and offline rows */
  .mlist .li.mrow { display: grid; grid-template-columns: 10px minmax(130px, 1.1fr) minmax(150px, .9fr) minmax(0, 1.2fr) auto 150px 16px; gap: 14px; color: inherit; }
  .mlist .li.mrow:hover { background: var(--surface-2); text-decoration: none; }
  .mrow .nm { min-width: 0; display: grid; }
  .mrow .nm b, .mrow .wk { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mrow .nm small, .mrow .nums { color: var(--text-3); font-size: 12px; }
  .mrow .nums { display: flex; gap: 10px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mrow .wk { font-size: 12.5px; color: var(--text-2); }
  .mrow .chev { color: var(--text-3); }
  .mrow.off { opacity: .85; }

  /* group editor */
  .geditor .ghead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .geditor .grow { display: grid; grid-template-columns: minmax(140px, 200px) minmax(110px, 160px) 1fr auto; gap: 10px; align-items: start; padding: 12px 0; border-top: 1px solid var(--divider); }
  .members { display: flex; flex-wrap: wrap; gap: 6px; }
  .mchip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 999px; background: var(--surface-2); font-size: 12.5px; cursor: pointer; user-select: none; }
  .mchip.on { background: var(--primary-soft); color: var(--primary); font-weight: 600; }

  /* wall of screens (Visualización) */
  .wall { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(var(--tile, 360px), 1fr)); }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); cursor: pointer; transition: transform .15s, box-shadow .15s, border-color .15s; position: relative; }
  .tile:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: color-mix(in srgb, var(--primary) 35%, var(--border)); }
  .tile .cap { display: flex; align-items: center; gap: 8px; padding: 9px 12px; min-width: 0; font-size: 13px; }
  .tile .cap b { font-weight: 650; white-space: nowrap; }
  .tile .cap small { color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; text-align: right; }
  .tile.pick .thumb { opacity: .55; }
  .tile.pick.picked { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary); }
  .tile.pick.picked .thumb { opacity: 1; }
  .tile .tick { position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
                background: var(--surface); border: 2px solid var(--border); color: var(--on-primary); }
  .tile.picked .tick { background: var(--primary); border-color: var(--primary); }
  .tile .tick .icon { width: 14px; height: 14px; stroke-width: 2.6; }
  /* uptime page */
  .up-card { margin-bottom: 12px; }
  .up-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .up-head a { color: var(--text); } .up-head b { font-size: 15px; font-weight: 650; }
  .up-head .pct { margin-left: auto; color: var(--text-2); font-weight: 600; }
  .ustrip { display: flex; gap: 2px; height: 34px; }
  .ustrip i { flex: 1; min-width: 2px; border-radius: 2px; background: var(--track); }
  .ustrip i.l1, .legend i.lg.l1 { background: color-mix(in srgb, var(--primary) 35%, var(--track)); }
  .ustrip i.l2, .legend i.lg.l2 { background: color-mix(in srgb, var(--primary) 60%, var(--track)); }
  .ustrip i.l3, .legend i.lg.l3 { background: color-mix(in srgb, var(--primary) 82%, var(--track)); }
  .ustrip i.l4, .legend i.lg.l4 { background: var(--primary); }
  .ustrip i.crash { background: var(--bad); }
  .ustrip i.nd { background: transparent; box-shadow: inset 0 0 0 1px var(--divider); }
  .ustrip i:hover { box-shadow: 0 0 0 2px var(--text-2); }
  .legend i.lg + i.lg { margin-left: -3px; }
  .up-axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-3); margin-top: 6px; }
  .fchart { display: grid; grid-template-columns: 24px 1fr; gap: 8px; margin-top: 14px; }
  .fchart svg { display: block; width: 100%; height: 160px; overflow: visible; }
  .fchart .yax { display: flex; flex-direction: column; justify-content: space-between; font-size: 11px; color: var(--text-3); text-align: right; }
  .xax { display: grid; grid-template-columns: repeat(7, 1fr); margin: 6px 0 0 32px; font-size: 11px; color: var(--text-3); }
  .ttip { position: fixed; z-index: 50; pointer-events: none; display: none; min-width: 170px; max-width: 260px; background: var(--surface); border: 1px solid var(--border);
          border-radius: 10px; padding: 8px 11px; font-size: 12px; box-shadow: var(--shadow-md); }
  .ttip b { display: block; margin-bottom: 4px; font-weight: 600; }
  .ttip .r { display: flex; justify-content: space-between; gap: 14px; color: var(--text-2); }
  .ttip .r.t-bad { color: var(--bad); }
  .shotcard img { display: block; width: 100%; border-radius: var(--radius-sm); margin-top: 12px; cursor: zoom-in; }

  @keyframes fade { from { opacity: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px) scale(.98); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  /* ---------- mobile: sidebar becomes a drawer ---------- */
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { position: fixed; inset: 0 auto 0 0; width: min(300px, 86vw); z-index: 25; transform: translateX(-100%); transition: transform .25s cubic-bezier(.2, .8, .2, 1); background: var(--surface); }
    .app.nav-open .sidebar { transform: none; box-shadow: var(--shadow-lg); }
    .scrim { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 24; }
    .app.nav-open .scrim { display: block; }
    .topbar { display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 20; padding: 10px 14px;
              background: var(--sidebar); border-bottom: 1px solid var(--border);
              -webkit-backdrop-filter: saturate(180%) blur(24px); backdrop-filter: saturate(180%) blur(24px); }
    .topbar .brand { padding: 0; font-size: 16px; }
    .view { padding: 20px 16px 48px; }
    .page-head h1 { font-size: 26px; }
    .page-head .actions { margin-left: 0; width: 100%; }
    .grid { grid-template-columns: 1fr; }
    .tasks .chev { display: none; }
    .tasks .li { padding: 12px; gap: 10px; }
    .mlist .li.mrow { grid-template-columns: 10px minmax(0, 1fr) auto 16px; }
    .mrow .nums, .mrow .wk, .mrow .sq-wrap { display: none; }
    .geditor .grow { grid-template-columns: 1fr auto; }
    .geditor .grow .members { grid-column: 1 / -1; }
    .wall { grid-template-columns: 1fr; }
    .hgrid { grid-template-columns: 44px repeat(24, minmax(0, 1fr)); gap: 2px; }
  }
</style>

<script>
"use strict";
const POLL_MS = 2000;
const HISTORY = 60; // samples kept per series (~2 min)
const history = new Map(); // key -> [{t, v}]
const lastGood = new Map(); // key -> last stats seen online
const lastSeen = new Map(); // key -> ms timestamp of last online poll

const S = {
  list: null,       // last /api/stats payload (null = not loaded yet)
  ok: true,         // panel backend reachable
  err: "",
  updatedAt: 0,
  version: null,    // /api/version payload, null if the endpoint doesn't exist
  pending: null,    // id of an action waiting for its inline confirmation
  busy: new Set(),  // ids of actions in flight
  audit: {},        // machine key -> {t, items, err, status, loading}
  showAuto: false,  // activity: also show the panel's own automatic queries
  add: { text: "", name: "" }, // "add machine" form
  cache: {},        // url -> {t, data, err, status, loading} (see load())
  taskFilter: "all", // tasks view: all | running | problems
  taskMachine: "",  // tasks view: "" = whole fleet
  taskOnlyErrors: false, // task detail: show only the failed actions
  ev: { list: [], last: 0, loaded: false, err: null, status: 0 }, // /api/events, oldest first
  evSeen: +localStorage.getItem("astrea.evSeen") || 0, // highest seq the user has looked at
  evOpenSeen: null, // evSeen when the notices view was opened: newer rows are highlighted
  evMachine: "",    // notices view: "" = whole fleet
  mem: {},          // machine key -> {draft, refreshing, q, programs, summary} (memory tab UI state)
  ui: null,         // layout saved in the panel (GET/PUT /api/ui): view, groups, collapsed sections, wall
  groupDraft: null, // group editor open: a working copy of S.ui.groups
  wallPick: false,  // wall: choosing which machines to show
};

/* ---------- layout settings (shared by every browser through the panel) ---------- */
const UI_DEFAULT = { view: "grid", showPresence: false, groups: [], collapsed: {}, offOpen: false, wall: { mode: "screen", size: "m", filter: "", selected: [] } };
const mergeUI = j => ({ ...UI_DEFAULT, ...j, collapsed: { ...(j?.collapsed || {}) }, wall: { ...UI_DEFAULT.wall, ...(j?.wall || {}) }, groups: Array.isArray(j?.groups) ? j.groups : [] });
S.ui = mergeUI(JSON.parse(localStorage.getItem("astrea.ui") || "{}"));
async function loadUI() {
  try {
    const j = await api("GET", "/api/ui");
    if (j && Object.keys(j).length) { S.ui = mergeUI(j); localStorage.setItem("astrea.ui", JSON.stringify(S.ui)); draw(); }
  } catch { /* older panel: the browser's copy is enough */ }
}
let uiTimer = 0;
function saveUI() {
  localStorage.setItem("astrea.ui", JSON.stringify(S.ui));
  clearTimeout(uiTimer);
  uiTimer = setTimeout(() => api("PUT", "/api/ui", JSON.stringify(S.ui)).catch(e => toast("No se pudo guardar la vista: " + e.message, "bad")), 400);
}

/* ---------- tiny DOM helpers ---------- */
const $ = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) el.append(k); // views nest arrays (groups of rows)
  return el;
};
const SVG = "http://www.w3.org/2000/svg";
function icon(name, cls = "") {
  const s = document.createElementNS(SVG, "svg");
  s.setAttribute("class", "icon " + cls);
  s.setAttribute("aria-hidden", "true");
  const u = document.createElementNS(SVG, "use");
  u.setAttribute("href", "#i-" + name);
  s.append(u);
  return s;
}
// modeChip: the AI's permission level, always visible (the user asked to see "yolo" at a glance).
function modeChip(admin, long = false) {
  const mode = admin?.mode;
  if (!mode) return null;
  const ro = mode === "readonly";
  const ic = icon(ro ? "eye" : "bolt");
  return $("span", { class: "chip t-" + (ro ? "neutral" : "primary"),
                     title: ro ? "Solo lectura: la IA puede mirar, pero no cambiar nada" : "Modo YOLO: la IA tiene control total del equipo" },
    ic, ro ? "Solo lectura" : long ? "YOLO · control total" : "YOLO");
}
const chip = (tone, label, withDot = true) => $("span", { class: "chip t-" + tone }, withDot ? $("span", { class: "dot" }) : null, label);

/* ---------- formatting ---------- */
function bytes(n) {
  if (n == null) return "—";
  const u = ["B", "KB", "MB", "GB", "TB"];
  let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (n >= 100 || i === 0 ? n.toFixed(0) : n.toFixed(1)) + " " + u[i];
}
const pct = v => v == null ? "—" : Math.round(v) + "%";
const clamp = v => Math.max(0, Math.min(100, v ?? 0));
function uptime(s) {
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? `${d} d ${h} h` : h ? `${h} h ${m} min` : `${m} min`;
}
function ago(sec) {
  if (sec == null) return "—";
  if (sec < 60) return "hace " + Math.max(1, Math.round(sec)) + " s";
  if (sec < 3600) return "hace " + Math.round(sec / 60) + " min";
  if (sec < 86400) return "hace " + Math.round(sec / 3600) + " h";
  return "hace " + Math.round(sec / 86400) + " d";
}
const hhmmss = t => new Date(t).toLocaleTimeString();
const keyOf = (m, idx) => m.name || "m" + idx;
const titleOf = (m, idx, s) => m.name || s?.host?.hostname || "Equipo " + (idx + 1);
const osName = s => [s?.host?.platform, s?.host?.platform_version].filter(Boolean).join(" ");

/* ---------- history (sparklines) ---------- */
const series = key => history.get(key) || [];
function record(key, v, t) {
  if (v == null) return;
  const h = history.get(key) || [];
  h.push({ t, v: clamp(v) });
  if (h.length > HISTORY) h.shift();
  history.set(key, h);
}
function recordAll(list, t) {
  list.forEach((m, idx) => {
    const key = keyOf(m, idx);
    if (m.online) lastSeen.set(key, t);
    if (!m.online || !m.stats) return;
    lastGood.set(key, m.stats);
    const s = m.stats;
    record(key + ":cpu", s.cpu?.usage_percent, t);
    record(key + ":mem", s.memory?.used_percent, t);
    (s.gpus || []).forEach((g, i) => record(`${key}:gpu${i}`, g.usage_percent, t));
  });
}

/* ---------- domain: one plain-language verdict per machine ---------- */
// presence() answers "can I use this PC right now?" — the question users actually have.
function presence(m, key) {
  if (!m.online) {
    const t = m.last_seen || lastSeen.get(key);
    return { tone: "bad", label: "Sin conexión", detail: t ? "Vista por última vez " + ago((Date.now() - t) / 1000) : "No responde" };
  }
  if (m.admin?.locked) return { tone: "bad", label: "Freno activado", detail: "El agente rechaza cualquier orden de la IA" };
  const idle = m.idle;
  if (!idle) return { tone: "good", label: "En línea", detail: "" };
  if (idle.session === "none") return { tone: "good", label: "Libre", detail: "Nadie ha iniciado sesión" };
  if (idle.locked) return { tone: "primary", label: "Bloqueada", detail: "Pantalla de bloqueo · Astrea entra sola cuando la IA la necesita", locked: true };
  if (idle.user_active) return { tone: "warn", label: "En uso", detail: "Alguien la está usando" + (idle.process ? " · " + idle.process : "") };
  return { tone: "good", label: "Libre", detail: "Sin actividad " + ago(idle.idle_sec).replace("hace ", "desde hace ") };
}
// idle.why is a closed list (internal/power/power.go); unknown values are not shown.
const WHY = {
  "keyboard/mouse in use": "Usando teclado/ratón",
  "the lock screen is up": "Pantalla bloqueada",
  "a single touch, not someone using it": "Un toque suelto, no hay nadie",
  "no input from a person": "Nadie la ha tocado",
  "no input from a person recently": "Nadie la toca hace rato",
  "recent input (no history yet)": "Actividad reciente",
  "only software moving the mouse/keyboard": "Solo un programa mueve el ratón, no hay nadie",
  "mechanical movement, not a hand": "Movimiento mecánico (jiggler o sensor), no una mano",
};
function gpuPeak(s) {
  let u = null, v = null;
  for (const g of (s?.gpus || [])) {
    if (g.usage_percent != null) u = Math.max(u ?? 0, g.usage_percent);
    if (g.vram_used != null && g.vram_total) v = Math.max(v ?? 0, g.vram_used / g.vram_total * 100);
  }
  return { u, v };
}
const services = m => (m.services && m.services.services) || [];
// Agent version lives in admin (admin.status). Agents < v0.3.0 don't report it; POST /api/update
// migrates them remotely, so for the user they're just "outdated".
const needsUpdate = m => !!m.admin?.update_available || needsReinstall(m);
const needsReinstall = m => m.online && m.admin && !m.admin.version;
const SVC = {
  running: ["good", "Funcionando"], starting: ["warn", "Arrancando"], backoff: ["warn", "Reintentando"],
  stopped: ["neutral", "Detenido"], exited: ["neutral", "Detenido"], failed: ["bad", "Falló"],
};
const svcState = st => SVC[st] || ["neutral", st || "Desconocido"];
// Astrea's own services (service.status → builtin): required on every PC, shown even before they exist.
// Agents that don't report them yet get these rows with state "unknown".
const BUILTIN_REQUIRED = [{ name: "ui-tars", required: true, state: "unknown" }];
const BUILTIN_TITLE = { "ui-tars": "UI-TARS · modelo de visión" };
const BUILTIN = {
  running: ["good", "Funcionando"], ready: ["good", "Instalado"], installing: ["warn", "Instalando"],
  error: ["bad", "Reintentando"], paused: ["neutral", "En pausa"], missing: ["bad", "Falta"], unknown: ["neutral", "Sin datos"],
};
const PHASE = {
  "downloading model": "Descargando el modelo", "downloading mmproj": "Descargando el proyector de visión",
  "downloading llama.cpp (CUDA)": "Descargando llama.cpp (CUDA)", "unpacking llama.cpp": "Descomprimiendo llama.cpp",
  "configuring": "Configurando",
};
function explain(err) {
  if (/unknown_method/.test(err)) return { title: "El agente de este equipo está desactualizado", body: "Reinstálalo o actualízalo para ver todos los datos." };
  if (/unauthorized|401/.test(err)) return { title: "La clave de acceso no coincide", body: "El token de este equipo en machines.json no es el que tiene el agente." };
  return { title: "No se puede contactar con este equipo", body: "Comprueba:", tips: ["Que esté encendido y con internet.", "Que Tailscale esté conectado en ambos equipos.", "Que el agente de Astrea esté en marcha."], raw: err };
}

/* ---------- routing ---------- */
function route() {
  const raw = location.hash.replace(/^#/, "");
  if (raw === "/tareas" || raw.startsWith("/tareas/")) {
    const [machine, id] = raw.slice(8).split("/").map(decodeURIComponent);
    return id ? { name: "task", machine, id } : { name: "tasks" };
  }
  const h = decodeURIComponent(raw);
  if (h.startsWith("/m/")) {
    const [id, tab] = h.slice(3).split("/");
    return { name: "machine", id, tab: TAB_IDS[tab] || "perf" };
  }
  if (h === "/ayuda") return { name: "help" };
  if (h === "/avisos") return { name: "events" };
  if (h === "/visual") return { name: "visual" };
  if (h === "/encendido") return { name: "uptime" };
  return { name: "overview" };
}
const TABS = [["perf", "Rendimiento", "rendimiento"], ["svc", "Servicios", "servicios"], ["work", "Tareas", "tareas"], ["hist", "Historial", "historial"], ["mem", "Memoria", "memoria"], ["act", "Actividad", "actividad"], ["sys", "Sistema", "sistema"]];
const taskHref = (machine, id) => "#/tareas/" + encodeURIComponent(machine) + "/" + encodeURIComponent(id);
const TAB_IDS = Object.fromEntries(TABS.map(t => [t[2], t[0]]));
const machineHref = (key, tab) => "#/m/" + encodeURIComponent(key) + (tab && tab !== "perf" ? "/" + TABS.find(t => t[0] === tab)[2] : "");

/* ---------- charts ---------- */
function meter(v, { hot = false, thin = false, label = "" } = {}) {
  return $("div", { class: "meter" + (hot ? " hot" : "") + (thin ? " thin" : ""), role: "meter", "aria-label": label,
                    "aria-valuemin": "0", "aria-valuemax": "100", "aria-valuenow": String(Math.round(v ?? 0)) },
    $("span", { style: `width:${clamp(v)}%` }));
}

function sparkline(points, label) {
  const W = 300, H = 64;
  const wrap = $("div", { class: "spark" });
  const svg = document.createElementNS(SVG, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("preserveAspectRatio", "none");
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", `${label}: historial de uso de los últimos 2 minutos`);
  const x = i => (HISTORY <= 1 ? 0 : (i + HISTORY - points.length) * W / (HISTORY - 1));
  const y = v => H - 1 - v / 100 * (H - 2);
  const mk = (tag, attrs) => { const e = document.createElementNS(SVG, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); svg.append(e); return e; };
  mk("line", { x1: 0, x2: W, y1: H - 0.5, y2: H - 0.5, stroke: "var(--divider)", "stroke-width": 1, "vector-effect": "non-scaling-stroke" });
  if (points.length > 1) {
    const line = points.map((p, i) => `${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
    mk("polygon", { points: `${x(0)},${H} ${line} ${x(points.length - 1)},${H}`, fill: "var(--primary-area)" });
    mk("polyline", { points: line, fill: "none", stroke: "var(--primary)", "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round", "vector-effect": "non-scaling-stroke" });
  }
  const cross = mk("line", { y1: 0, y2: H, stroke: "var(--text-3)", "stroke-width": 1, "vector-effect": "non-scaling-stroke", visibility: "hidden" });
  const tip = $("div", { class: "tip" });
  svg.addEventListener("mousemove", ev => {
    if (!points.length) return;
    const r = svg.getBoundingClientRect();
    const fx = (ev.clientX - r.left) / r.width * W;
    let best = 0;
    points.forEach((p, i) => { if (Math.abs(x(i) - fx) < Math.abs(x(best) - fx)) best = i; });
    const p = points[best], px = x(best);
    cross.setAttribute("x1", px); cross.setAttribute("x2", px); cross.setAttribute("visibility", "visible");
    tip.textContent = `${pct(p.v)} · ${hhmmss(p.t)}`;
    tip.style.left = (px / W * 100) + "%";
    tip.style.display = "block";
  });
  svg.addEventListener("mouseleave", () => { cross.setAttribute("visibility", "hidden"); tip.style.display = "none"; });
  wrap.append(svg, tip, $("div", { class: "axis" }, $("span", {}, "hace 2 min"), $("span", {}, "ahora")));
  return wrap;
}

/* ---------- fleet notices (avisos) ---------- */
// The panel keeps the last 300 in memory (lost when it restarts) and long-polls them out:
// GET /api/events once, then ?since=last&wait=60 forever. Seqs start at the clock, so they keep growing across restarts.
const LEVEL = { good: "good", info: "primary", warn: "warn", bad: "bad" };
const evTone = e => LEVEL[e.level] || "neutral";
const evAgo = e => Date.now() - e.time < 864e5 ? ago((Date.now() - e.time) / 1000) : when(e.time);
// Someone sat down / the PC was left free: one every few minutes in a busy aula.
// Hidden unless asked for, and they never light the unread badge.
const PRESENCE_KINDS = new Set(["busy", "free"]);

function markSeen() {
  if (S.ev.last <= S.evSeen) return;
  S.evSeen = S.ev.last;
  localStorage.setItem("astrea.evSeen", String(S.evSeen));
}
const lastEvent = key => S.ev.list.findLast(e => e.machine === key && !PRESENCE_KINDS.has(e.kind));
async function pollEvents() {
  for (;;) {
    try {
      const r = await fetch("/api/events" + (S.ev.loaded ? "?" + q({ since: S.ev.last, wait: 60 }) : ""), { cache: "no-store" });
      if (r.status === 404) { S.ev.status = 404; S.ev.loaded = true; draw(); return; } // panel older than v0.5
      if (!r.ok) throw new Error("HTTP " + r.status);
      const j = await r.json();
      const fresh = (j.events || []).filter(e => e.seq > S.ev.last);
      S.ev.list = S.ev.list.concat(fresh).slice(-300);
      S.ev.last = Math.max(S.ev.last, j.last || 0);
      if (!S.ev.loaded && !localStorage.getItem("astrea.evSeen")) markSeen(); // first visit ever: nothing is "new"
      S.ev.loaded = true; S.ev.err = null;
      if (fresh.length || S.ev.list.length === 0) { if (holdDraw()) drawSidebar(); else draw(); }
    } catch (e) {
      S.ev.err = e.message;
      await new Promise(res => setTimeout(res, 5000));
    }
  }
}

/* ---------- screens: small cached screenshots that survive redraws ---------- */
// The view is rebuilt every 2 s; the <img> nodes live here and are moved into
// the new tree, so a picture only reloads when it is older than `every`.
const thumbs = new Map(); // name@width -> {img, t, ok, failed, loading}
function thumbOf(name, w, every) {
  const k = name + "@" + w;
  let t = thumbs.get(k);
  if (!t) thumbs.set(k, t = { img: $("img", { alt: "Pantalla de " + name, draggable: "false", decoding: "async" }), t: 0 });
  if (!t.loading && Date.now() - t.t > every) {
    t.loading = true;
    const pre = new Image();
    pre.onload = () => { t.img.src = pre.src; t.ok = true; t.failed = false; t.loading = false; t.t = Date.now(); t.box?.replaceChildren(...thumbKids(t)); };
    pre.onerror = () => { t.failed = true; t.loading = false; t.t = Date.now(); t.box?.replaceChildren(...thumbKids(t)); };
    pre.src = "/api/thumb?" + q({ machine: name, w, max_age: Math.max(2, Math.round(every / 1000) - 1), _: Date.now() });
  }
  return t;
}
const thumbKids = t => t.ok ? [t.img, ...(t.over || [])]
  : [$("div", { class: "ph" }, icon("desktop"), t.failed ? "No se pudo ver la pantalla" : "Cargando pantalla…"), ...(t.over || [])];
// screenBox: the picture of an online machine (or a placeholder), with chips over it.
function screenBox(m, w, every, over = []) {
  const ov = over.some(Boolean) ? [$("div", { class: "over" }, over)] : [];
  if (!m.online) return $("div", { class: "thumb" }, $("div", { class: "ph" }, icon("power"), "Sin conexión"), ...ov);
  const t = thumbOf(m.name, w, every);
  t.over = ov;
  const box = $("div", { class: "thumb" }, ...thumbKids(t));
  t.box = box;
  return box;
}

/* ---------- uptime and AI activity (sys.uptime, kept by each agent) ---------- */
const UPTIME_URL = "/api/uptime?" + q({ days: 30 });
const fleetUptime = () => load(UPTIME_URL, 60000);
const uptimeOf = name => (S.cache[UPTIME_URL]?.data || []).find(x => x.machine === name)?.report;
const dayStart = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d; };
// Splits every on-span over local hours: cb(hourStart ms, ms on in that hour, the span).
function eachHourOn(rep, from, cb) {
  for (const sp of rep?.spans || []) {
    let a = Math.max(Date.parse(sp.start), from);
    const b = sp.end_kind === "running" ? Date.now() : Date.parse(sp.end);
    while (a < b) {
      const h = new Date(a); h.setMinutes(0, 0, 0);
      const next = Math.min(b, h.getTime() + 36e5);
      cb(h.getTime(), next - a, sp);
      a = next;
    }
  }
}
// days(): the last n local days, oldest first: {d, actions, on (ms)}.
function days(rep, n) {
  const start = dayStart(Date.now()); start.setDate(start.getDate() - n + 1);
  const out = Array.from({ length: n }, (_, i) => { const d = new Date(start); d.setDate(d.getDate() + i); return { d, actions: 0, on: 0 }; });
  const idx = t => Math.round((dayStart(t) - start) / 864e5);
  for (const h of rep?.activity || []) { const i = idx(Date.parse(h.hour)); if (out[i]) out[i].actions += h.actions; }
  eachHourOn(rep, start.getTime(), (h, ms) => { const i = idx(h); if (out[i]) out[i].on += ms; });
  return out;
}
// Fixed steps, so two PCs can be compared at a glance.
const level = n => n >= 100 ? "l4" : n >= 30 ? "l3" : n >= 10 ? "l2" : n > 0 ? "l1" : "";
const dayName = d => d.toLocaleDateString([], { weekday: "short", day: "numeric", month: "short" });
const hm = ms => { const m = Math.round(ms / 6e4); return m >= 60 ? `${Math.floor(m / 60)} h${m % 60 ? " " + (m % 60) + " min" : ""}` : m + " min"; };
// squares(): one square per day, like GitHub's or Claude Code's activity chart.
function squares(name, n, withLabel = true) {
  const rep = uptimeOf(name);
  if (!rep) return null;
  const ds = days(rep, n);
  const total = ds.reduce((a, d) => a + d.actions, 0);
  return $("div", { class: "sq-wrap" },
    withLabel ? $("div", { class: "lbl" }, $("span", {}, "Actividad de la IA · " + n + " días"), $("span", { class: "tnum" }, plural(total, "acción", "acciones"))) : null,
    $("div", { class: "sq", role: "img", "aria-label": `Actividad de la IA en los últimos ${n} días: ${total} acciones` },
      ds.map(d => $("i", { class: level(d.actions) || (d.on > 0 ? "on" : ""),
        title: `${dayName(d.d)} · ${d.actions ? plural(d.actions, "acción", "acciones") + " de la IA" : "sin actividad de la IA"} · ${d.on ? "encendida " + hm(d.on) : "apagada"}` }))));
}

const globRe = p => new RegExp("^" + p.replace(/[.+^${}()|[\]\\]/g, "\\$&").replace(/\*/g, ".*").replace(/\?/g, ".") + "$", "i");
const byPattern = (g, name) => (g.pattern || "").split(/[,\s]+/).filter(Boolean).some(p => globRe(p).test(name));

// grouped(): each machine in the first group it belongs to; the rest at the end.
function grouped(entries) {
  const used = new Set(), out = [];
  for (const g of S.ui.groups) {
    const items = entries.filter(e => !used.has(e.m.name) && inGroup(g, e.m.name));
    items.forEach(e => used.add(e.m.name));
    out.push({ name: g.name, items });
  }
  const rest = entries.filter(e => !used.has(e.m.name));
  if (rest.length) out.push({ name: "Sin grupo", items: rest });
  return out;
}

// days(): + crashes per day and whether the agent/OS log covers that day at all.

    if (ds[i]) ds[i].crash++;

}

// PCs on per hour over the last 7 days: one series, crosshair tooltip with their names.
function fleetOnChart(reps) {
  const H = 160, W = 1000, hours = 7 * 24;
  const start = dayStart(Date.now()); start.setDate(start.getDate() - 6);
  const t0 = start.getTime(), sets = Array.from({ length: hours }, () => new Set());
  for (const [name, rep] of reps) eachHourOn(rep, t0, (h, ms) => { const i = Math.round((h - t0) / 36e5); if (sets[i] && ms > 0) sets[i].add(name); });
  const nowI = Math.min(hours - 1, Math.floor((Date.now() - t0) / 36e5));
  const max = Math.max(1, reps.length);
  const x = i => i / (hours - 1) * W, y = v => H - 2 - v / max * (H - 8);
  const svg = document.createElementNS(SVG, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("preserveAspectRatio", "none");
  svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "Equipos encendidos por hora, últimos 7 días");
  const mk = (tag, attrs) => { const e = document.createElementNS(SVG, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); svg.append(e); return e; };
  const ticks = max >= 2 ? [max, Math.round(max / 2), 0] : [max, 0];
  for (const v of ticks) mk("line", { x1: 0, x2: W, y1: y(v), y2: y(v), stroke: "var(--divider)", "stroke-width": 1, "vector-effect": "non-scaling-stroke" });
  for (let d = 1; d < 7; d++) mk("line", { x1: x(d * 24), x2: x(d * 24), y1: 0, y2: H, stroke: "var(--divider)", "stroke-width": 1, "vector-effect": "non-scaling-stroke" });
  const pts = sets.slice(0, nowI + 1).map((s, i) => `${x(i).toFixed(1)},${y(s.size).toFixed(1)}`).join(" ");
  mk("polygon", { points: `0,${H} ${pts} ${x(nowI)},${H}`, fill: "var(--primary-area)" });
  mk("polyline", { points: pts, fill: "none", stroke: "var(--primary)", "stroke-width": 2, "stroke-linejoin": "round", "vector-effect": "non-scaling-stroke" });
  const cross = mk("line", { y1: 0, y2: H, stroke: "var(--text-3)", "stroke-width": 1, "vector-effect": "non-scaling-stroke", visibility: "hidden" });
  svg.addEventListener("mousemove", ev => {
    const r = svg.getBoundingClientRect();
    const i = Math.max(0, Math.min(nowI, Math.round((ev.clientX - r.left) / r.width * (hours - 1))));
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("visibility", "visible");
    const t = new Date(t0 + i * 36e5), names = [...sets[i]].sort();
    showTip(ev, `${dayName(t)}, ${t.getHours()}:00`, [[plural(names.length, "equipo encendido", "equipos encendidos"), ""], ...names.map(n => ["", n])]);
  });
  svg.addEventListener("mouseleave", () => { cross.setAttribute("visibility", "hidden"); hideTip(); });
  const labels = Array.from({ length: 7 }, (_, d) => { const t = new Date(start); t.setDate(t.getDate() + d); return $("span", {}, t.toLocaleDateString([], { weekday: "short", day: "numeric" })); });
  return $("div", { class: "card" },
    $("h3", {}, icon("activity"), "Equipos encendidos por hora"),
    $("div", { class: "model" }, "Últimos 7 días · de " + max + " " + (max === 1 ? "equipo" : "equipos")),
    $("div", { class: "fchart" }, $("div", { class: "yax tnum" }, ticks.map(v => $("span", {}, String(v)))), svg),
    $("div", { class: "xax" }, labels));
}

/* machine history: when it was on and what the AI did, hour by hour */
const END = { running: ["good", "Encendida"], off: ["neutral", "Apagado normal"], sleep: ["neutral", "Suspendida"], crash: ["bad", "Apagón o reinicio forzado"] };
function tabHistory(m, key) {
  const url = "/api/uptime?" + q({ machine: m.name, days: 30 });
  const c = load(url, m.online ? 30000 : 120000);
  if (!c.t) return $("div", { class: "card empty" }, "Cargando el historial…");
  const rep = c.data?.report;
  if (!rep) return $("div", { class: "callout t-" + (/actualízalo/.test(c.err || "") ? "warn" : "bad") }, icon("alert"),
    $("div", {}, $("b", {}, /actualízalo/.test(c.err || "") ? "El agente de este equipo aún no guarda su historial" : "No se pudo leer el historial"),
      $("p", {}, /actualízalo/.test(c.err || "") ? "Actualízalo: desde ese momento recuerda cuándo estuvo encendido, y además rellena lo anterior con el registro de Windows." : c.err || "")));

  const N = 14, from = dayStart(Date.now()); from.setDate(from.getDate() - N + 1);
  const cells = {}; // hour ms -> {on, n, crash}
  const cell = h => cells[h] || (cells[h] = { on: 0, n: 0 });
  eachHourOn(rep, from.getTime(), (h, ms) => { cell(h).on += ms; });
  for (const sp of rep.spans || []) if (sp.end_kind === "crash") { const h = new Date(sp.end); h.setMinutes(0, 0, 0); cell(h.getTime()).crash = true; }
  for (const a of rep.activity || []) { const h = new Date(a.hour); h.setMinutes(0, 0, 0); if (h >= from) cell(h.getTime()).n += a.actions; }

  const win = Date.now() - from.getTime();
  let on = 0, acts = 0;
  for (const v of Object.values(cells)) { on += v.on; acts += v.n; }
  const inWin = (rep.spans || []).filter(sp => Date.parse(sp.end) >= from.getTime() || sp.end_kind === "running");
  const crashes = inWin.filter(sp => sp.end_kind === "crash").length;
  const cur = (rep.spans || []).at(-1);

  const grid = [$("span"), ...Array.from({ length: 24 }, (_, h) => $("span", { class: "hr" }, h % 6 === 0 ? String(h) : ""))];
  for (let d = N - 1; d >= 0; d--) {
    const day = new Date(from); day.setDate(day.getDate() + d);
    grid.push($("span", { class: "day" }, day.toLocaleDateString([], { weekday: "short", day: "numeric" })));
    for (let h = 0; h < 24; h++) {
      const t = new Date(day); t.setHours(h);
      const v = cells[t.getTime()] || { on: 0, n: 0 };
      const future = t.getTime() > Date.now();
      grid.push($("i", { class: [future ? "" : level(v.n) || (v.on > 0 ? "on" : ""), v.crash ? "crash" : ""].join(" ").trim() || null,
        title: future ? null : `${dayName(t)}, ${h}:00–${h + 1}:00 · ${v.on ? "encendida " + hm(v.on) : "apagada"}${v.n ? " · " + plural(v.n, "acción", "acciones") + " de la IA" : ""}${v.crash ? " · se cortó de golpe" : ""}` }));
    }
  }

  const span = sp => {
    const [tone, label] = END[sp.end_kind] || ["neutral", sp.end_kind];
    const a = Date.parse(sp.start), b = sp.end_kind === "running" ? Date.now() : Date.parse(sp.end);
    return $("div", { class: "li" },
      $("div", { class: "k" }, when(sp.start) + " → " + (sp.end_kind === "running" ? "ahora" : when(sp.end)),
        $("small", {}, dur(b - a) + (sp.source === "os" ? " · del registro del sistema, antes de instalar Astrea" : ""))),
      $("div", { class: "v" }, chip(tone, label)));
  };

  return [
    c.data.stale ? $("div", { class: "callout sm t-warn", style: "margin:0 0 18px" }, icon("info"), $("div", {}, $("p", {}, "El equipo no responde: así estaba " + when(c.data.cached_at) + "."))) : null,
